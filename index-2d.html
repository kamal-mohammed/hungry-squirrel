<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hungry Squirrel</title>
<style>
  :root {
    --sky-top: #bfe6ff;
    --sky-bottom: #eaf7ff;
    --ground: #6fa84f;
    --ground-dark: #4f8536;
    --trunk: #7a4b25;
    --trunk-dark: #5a361a;
    --leaf: #3f9a46;
    --leaf-dark: #2f7a37;
    --pile: #8a5a2b;
    --pile-dark: #5e3b19;
    --ghost: rgba(120, 120, 120, 0.35);
    --ghost-line: rgba(80, 80, 80, 0.5);
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--sky-bottom);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #ui {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: none;
    justify-content: center;
    align-items: center;
    gap: 18px;
    padding: 0 16px calc(28px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  #ui.show { display: flex; }
  .btn {
    pointer-events: auto;
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 0;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    font-size: 34px;
    line-height: 72px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .btn:active { transform: scale(0.94); }
  .btn.ok { background: #d9f7d3; }
  #center {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    pointer-events: none;
  }
  #center.show { display: flex; }
  .btn.big {
    width: 104px; height: 104px;
    line-height: 104px;
    font-size: 48px;
    padding-left: 8px;      /* optical centring for the play glyph */
    box-sizing: border-box;
  }
  #pauseBtn {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: 14px;
    width: 52px; height: 52px;
    line-height: 52px;
    font-size: 24px;
    display: none;
    pointer-events: auto;
    background: rgba(255,255,255,0.75);
  }
  #pauseBtn.show { display: block; }
  #muteBtn {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    right: 14px;
    width: 52px; height: 52px;
    line-height: 52px;
    font-size: 22px;
    pointer-events: auto;
    background: rgba(255,255,255,0.75);
  }
  #hud {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: 80px;
    display: none;
    gap: 10px;
    pointer-events: none;
  }
  #hud.show { display: flex; }
  #hud.nopause { left: 14px; }   /* no pause button to sit beside at game over */
  .stat {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 52px;
    padding: 0 16px 0 12px;
    border-radius: 26px;
    background: rgba(255,255,255,0.75);
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    font: 700 22px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    color: #3b2314;
  }
  .stat .ico {
    position: relative;
    font-size: 22px;
    line-height: 1;
    font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  }
  .stat.hearts { gap: 3px; padding: 0 12px; }
  .stat.hearts .h {
    font-size: 24px;
    line-height: 1;
    color: #e0433c;
    transition: color 0.25s ease, transform 0.25s ease;
  }
  .stat.hearts .h.lost { color: #b9b0a8; }
  .stat.hearts .h.pop { animation: heartpop 0.45s ease; }
  .stat.hearts .h.gain { animation: heartgain 0.6s ease; }
  @keyframes heartgain {
    0%   { transform: scale(0.2); color: #ffd84a; }
    50%  { transform: scale(1.6); color: #ffd84a; }
    100% { transform: scale(1); }
  }
  @keyframes heartpop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.5) rotate(-12deg); }
    100% { transform: scale(1); }
  }
  @media (max-width: 420px) {
    #hud { gap: 7px; }
    .stat { height: 46px; padding: 0 12px 0 10px; font-size: 19px; border-radius: 23px; }
    .stat .ico { font-size: 19px; }
    .stat.hearts { padding: 0 10px; }
    .stat.hearts .h { font-size: 21px; }
  }
  #linkbox {
    position: fixed;
    left: 16px; right: 16px;
    bottom: calc(116px + env(safe-area-inset-bottom));
    display: none;
    pointer-events: auto;
  }
  #linkbox.show { display: block; }
  #linkbox input {
    width: 100%;
    box-sizing: border-box;
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.15);
    background: rgba(255,255,255,0.95);
    -webkit-user-select: text;
    user-select: text;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="center">
  <button class="btn big" id="playBtn" aria-label="Start">▶</button>
</div>
<button class="btn" id="pauseBtn" aria-label="Pause">⏸</button>
<button class="btn" id="muteBtn" aria-label="Sound on or off">🔊</button>
<div id="hud" aria-live="off">
  <span class="stat hearts" id="heartsStat" title="Lives"><span class="h">♥</span><span class="h">♥</span><span class="h">♥</span></span>
</div>

<div id="ui">
  <button class="btn" id="shareBtn" aria-label="Copy share link">🔗</button>
  <button class="btn" id="replayBtn" aria-label="Play again">🔁</button>
</div>
<div id="linkbox"><input id="linkInput" type="text" readonly></div>

<script>
(() => {
  'use strict';

  // ------------------------------------------------------------------
  // Canvas and sizing
  // ------------------------------------------------------------------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // ------------------------------------------------------------------
  // Emoji art with shape fallback
  // ------------------------------------------------------------------
  const ART = { acorn: '🌰', branch: '🪵' };   // the squirrel is drawn by hand below
  const emojiOK = {};

  function glyphPixels(ch) {
    const c = document.createElement('canvas');
    c.width = 32; c.height = 32;
    const g = c.getContext('2d');
    g.textBaseline = 'middle';
    g.textAlign = 'center';
    g.font = '24px sans-serif';
    g.fillText(ch, 16, 16);
    return g.getImageData(0, 0, 32, 32).data;
  }
  function samePixels(a, b) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }
  function detectEmoji() {
    let missing;
    try { missing = glyphPixels('\u{10FFFF}'); } catch (e) { missing = null; }
    for (const k in ART) {
      try {
        const px = glyphPixels(ART[k]);
        let any = false;
        for (let i = 3; i < px.length; i += 4) if (px[i] > 0) { any = true; break; }
        emojiOK[k] = any && !(missing && samePixels(px, missing));
      } catch (e) {
        emojiOK[k] = false;
      }
    }
  }

  function drawEmoji(ch, x, y, size) {
    ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ch, x, y + size * 0.06);
  }

  // ------------------------------------------------------------------
  // World layout (recomputed on resize)
  // ------------------------------------------------------------------
  const L = {};   // layout numbers
  function layout() {
    L.S = Math.max(48, Math.min(96, W * 0.14));        // squirrel size
    L.groundY0 = H - Math.max(70, H * 0.12);           // the real ground
    L.groundY = L.groundY0 - (state ? state.rise : 0);  // the surface, rising with missed acorns
    L.trunkW = Math.max(26, L.S * 0.5);
    L.trunkX = W - L.trunkW * 1.4;                     // trunk left edge
    L.pileX = L.trunkX - L.S * 0.15;                   // real pile center
    L.ghostX = L.trunkX - L.S * 1.25;                  // ghost pile center
    L.acornR = L.S * 0.19;
    L.branchW = L.S * 1.35;
    L.branchH = L.S * 0.32;
    L.canopyY = Math.max(40, H * 0.08);
    buildBackground();
  }

  // Pile radius in pixels for a count of acorns. Grows quickly at first so
  // every early catch is visible, then flattens toward a cap so a big score
  // never swallows the play area. Ghost and real piles share this curve.
  function pileRadius(n) {
    if (n <= 0) return 0;
    const rMax = Math.min(W * 0.20, H * 0.22, (H - L.groundY) * 0.3 + L.S * 1.3);
    return rMax * Math.tanh(Math.sqrt(n) / 6);
  }

  // ------------------------------------------------------------------
  // Game state
  // ------------------------------------------------------------------
  const TUNE = {
    followLag: 12,          // higher = snappier (per second easing rate)
    keySpeed: 1.6,          // screen widths per second with arrow keys
    acornSpeed: 0.28,       // screen heights per second at start
    acornInterval: 1.05,    // seconds between acorns at start
    branchInterval: 4.2,    // seconds between branches at start
    branchSpeed: 0.40,      // screen heights per second at start
    rampTime: 75,           // seconds to reach max speed
    maxMul: 2.4,            // speed multiplier at rampTime
    knockdown: 2.0,         // seconds on the back
    invuln: 1.0,            // seconds of safety after getting up
    maxPile: 9999,
    missesToFill: 150,      // missed acorns it takes to raise the ground to the canopy
    maxLives: 3,            // golden acorns refill up to three, never beyond
    goldChance: 0.03,       // chance that a spawned acorn is golden (after the tutorial)
    goldMinGap: 15,         // seconds between golden acorns at least
    goldStart: 10,          // no golden acorns in the first seconds of a run
    rottenChance: 0.07,     // chance that a spawned acorn is rotten
    rottenMinGap: 6,        // seconds between rotten acorns at least
    rottenStart: 8,         // no rotten acorns in the first seconds of a run
    slowTime: 3.0,          // seconds the squirrel is slowed after eating a rotten acorn
    slowFactor: 0.3         // how much of its normal speed it keeps while sick
  };

  const state = {
    mode: 'ready',          // 'ready' | 'playing' | 'paused' | 'gameover'
    t: 0,
    sx: 0, targetX: 0, vx: 0, facing: 1,
    knocked: 0, invuln: 0,
    lives: 3, pile: 0, ghost: 0, ghostBuried: false,
    acorns: [], branches: [],
    acornTimer: 0, branchTimer: 0,
    keys: { left: false, right: false },
    pointerDown: false,
    tut: 0,                 // textless tutorial: 0 = first acorn pending, 1 = second pending, 2 = done
    dance: 0,               // seconds of victory dance remaining
    streak: 0,              // consecutive catches; drives the crunch pitch
    litter: [],             // missed acorns lying on the ground: {fx, up, gold, rot}
    rise: 0,                // how far the litter has lifted the ground, in px
    maxLives: 3,            // most lives held this run; sets how many hearts are shown
    lastGold: -99,          // time the last golden acorn appeared
    lastRotten: -99,        // time the last rotten acorn appeared
    slow: 0,                // seconds of stomach ache left after a rotten acorn
    sparkle: 0,             // seconds of sparkle left after catching a golden acorn
    runPhase: 0,            // leg animation phase
    over: { t: 0, fromX: 0, shown: false, munched: false }
  };

  function speedMul() {
    const k = Math.min(1, state.t / TUNE.rampTime);
    return 1 + (TUNE.maxMul - 1) * k;
  }

  function readGhost() {
    const q = new URLSearchParams(location.search);
    const raw = parseInt(q.get('pile'), 10);
    if (!isFinite(raw) || raw <= 0) return 0;
    return Math.min(TUNE.maxPile, raw);
  }

  // Fresh run. `startNow` skips the start screen (used by the replay button).
  function reset(startNow = false) {
    state.mode = startNow ? 'playing' : 'ready';
    state.t = 0;
    state.sx = W * 0.4;
    state.targetX = state.sx;
    state.vx = 0;
    state.facing = 1;
    state.knocked = 0;
    state.invuln = 0;
    state.lives = 3;
    state.pile = 0;
    state.ghost = readGhost();
    state.ghostBuried = false;
    state.acorns.length = 0;
    state.branches.length = 0;
    state.acornTimer = 0.6;
    state.branchTimer = TUNE.branchInterval * 1.3;
    state.over.t = 0;
    state.over.shown = false;
    state.over.munched = false;
    state.tut = 0;
    state.dance = 0;
    state.streak = 0;
    state.litter.length = 0;
    state.rise = 0;
    L.groundY = L.groundY0;
    state.maxLives = 3;
    state.lastGold = -99;
    state.lastRotten = -99;
    state.slow = 0;
    state.sparkle = 0;
    state.runPhase = 0;
    linkbox.classList.remove('show');
    shareBtn.classList.remove('ok');
    syncUI();
  }

  function startGame() {
    if (state.mode !== 'ready') return;
    state.mode = 'playing';
    state.pointerDown = false;
    syncUI();
  }
  function pauseGame() {
    if (state.mode !== 'playing') return;
    state.mode = 'paused';
    state.pointerDown = false;
    state.keys.left = state.keys.right = false;
    syncUI();
  }
  function resumeGame() {
    if (state.mode !== 'paused') return;
    state.mode = 'playing';
    state.targetX = state.sx;     // no lurch toward wherever the finger landed
    syncUI();
  }

  // Which buttons are on screen follows the mode. Icons only, no text.
  function syncUI() {
    center.classList.toggle('show', state.mode === 'ready' || state.mode === 'paused');
    pauseBtn.classList.toggle('show', state.mode === 'playing');
    hud.classList.toggle('show', state.mode !== 'ready');
    hud.classList.toggle('nopause', state.mode === 'gameover');
    ui.classList.toggle('show', state.mode === 'gameover' && state.over.shown);
  }

  // ------------------------------------------------------------------
  // Input
  // ------------------------------------------------------------------
  function pointerX(e) {
    const r = canvas.getBoundingClientRect();
    return e.clientX - r.left;
  }
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    SFX.unlock();   // browsers only allow audio after a gesture
    if (state.mode === 'ready') { startGame(); return; }
    if (state.mode === 'paused') { resumeGame(); return; }
    if (state.mode === 'gameover') {
      if (state.over.shown) reset(true);
      return;
    }
    state.pointerDown = true;
    state.targetX = pointerX(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener('pointermove', e => {
    if (!state.pointerDown || state.mode !== 'playing') return;
    e.preventDefault();
    state.targetX = pointerX(e);
  });
  const release = e => { state.pointerDown = false; };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('lostpointercapture', release);

  window.addEventListener('keydown', e => {
    SFX.unlock();
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.keys.right = true;
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      if (state.mode === 'playing') pauseGame();
      else if (state.mode === 'paused') resumeGame();
      e.preventDefault();
      return;
    }
    if (e.key === ' ') {
      // Space is the one-key remote: start, pause, resume, play again.
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      if (state.mode === 'ready') startGame();
      else if (state.mode === 'playing') pauseGame();
      else if (state.mode === 'paused') resumeGame();
      else if (state.mode === 'gameover' && state.over.shown) reset(true);
      e.preventDefault();
      return;
    }
    if (e.key === 'Enter') {
      if (state.mode === 'ready') startGame();
      else if (state.mode === 'paused') resumeGame();
      else if (state.mode === 'gameover' && state.over.shown) reset(true);
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.keys.right = false;
  });

  // ------------------------------------------------------------------
  // Share UI
  // ------------------------------------------------------------------
  const ui = document.getElementById('ui');
  const center = document.getElementById('center');
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  for (const b of [playBtn, pauseBtn]) b.addEventListener('pointerdown', e => e.stopPropagation());
  playBtn.addEventListener('click', e => {
    e.stopPropagation(); SFX.unlock();
    if (state.mode === 'ready') startGame(); else resumeGame();
  });
  pauseBtn.addEventListener('click', e => { e.stopPropagation(); pauseGame(); });
  // A focused button would swallow the next Space press, so buttons let go of focus after a click.
  for (const b of document.querySelectorAll('button')) b.addEventListener('click', () => b.blur());

  // Lives display. DOM is only touched when the number changes.
  const hud = document.getElementById('hud');
  const hearts = Array.from(document.querySelectorAll('#heartsStat .h'));
  let hudLives = -1;
  function updateHud() {
    if (hudLives !== state.lives) {
      // Filled hearts = lives remaining, hollow grey hearts = lives used.
      // Hearts empty from the right so the remaining ones stay in place.
      const losing = hudLives > state.lives;
      const gaining = hudLives >= 0 && hudLives < state.lives;
      hudLives = state.lives;
      hearts.forEach((h, i) => {
        const alive = i < state.lives;
        h.textContent = alive ? '♥' : '♡';
        h.classList.toggle('lost', !alive);
        h.classList.remove('pop', 'gain');
        if (losing && i === state.lives) { void h.offsetWidth; h.classList.add('pop'); }
        if (gaining && i === state.lives - 1) { void h.offsetWidth; h.classList.add('gain'); }
      });
    }
  }
  const shareBtn = document.getElementById('shareBtn');
  const replayBtn = document.getElementById('replayBtn');
  const linkbox = document.getElementById('linkbox');
  const linkInput = document.getElementById('linkInput');

  function shareURL() {
    return `${location.origin}${location.pathname}?pile=${Math.min(TUNE.maxPile, state.pile)}`;
  }
  async function share() {
    const url = shareURL();
    let ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(url);
        ok = true;
      }
    } catch (_) { ok = false; }
    if (ok) {
      shareBtn.classList.add('ok');
      shareBtn.textContent = '✅';
      setTimeout(() => { shareBtn.textContent = '🔗'; shareBtn.classList.remove('ok'); }, 1400);
    } else {
      linkInput.value = url;
      linkbox.classList.add('show');
      linkInput.focus();
      linkInput.select();
    }
  }
  shareBtn.addEventListener('pointerdown', e => e.stopPropagation());
  replayBtn.addEventListener('pointerdown', e => e.stopPropagation());
  shareBtn.addEventListener('click', e => { e.stopPropagation(); share(); });
  replayBtn.addEventListener('click', e => { e.stopPropagation(); SFX.unlock(); reset(true); });

  // ------------------------------------------------------------------
  // Sound: everything is synthesised with Web Audio, no files needed.
  // SFX.play(name) is the only entry point so Day 3 sounds slot in here.
  // ------------------------------------------------------------------
  const SFX = (() => {
    let ac = null, master = null, noiseBuf = null;

    function unlock() {
      if (!ac) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ac = new AC();
          master = ac.createGain();
          master.gain.value = 0.8;
          master.connect(ac.destination);
        } catch (_) { ac = null; return; }
      }
      if (ac.state === 'suspended') ac.resume().catch(() => {});
      applyMute();
      startWind();
      startMusic();
    }

    // Mute covers everything: music, wind and effects. Remembered between visits.
    let muted = false;
    try { muted = localStorage.getItem('hs-muted') === '1'; } catch (_) {}
    function applyMute() {
      if (master) master.gain.setTargetAtTime(muted ? 0 : 0.8, ac.currentTime, 0.03);
    }
    function toggleMute() {
      muted = !muted;
      try { localStorage.setItem('hs-muted', muted ? '1' : '0'); } catch (_) {}
      applyMute();
      return muted;
    }

    // Background music: an eight-bar loop in C pentatonic, scheduled a little
    // ahead of time so it never stutters. Bass on the bar, a soft arpeggio on
    // the eighths, and a simple melody on top. Runs as long as the page lives.
    const MUSIC = {
      bpm: 96,
      bass:   [36, 33, 29, 31],                       // C2 A1 F1 G1, two bars each
      chords: [[60, 67, 64], [57, 64, 60], [53, 60, 57], [55, 62, 59]],
      arp:    [0, 1, 2, 1, 0, 2, 1, 2],               // chord-tone index per eighth
      melody: [76, 79, 81, 79,  76, 74, 72, 0,
               69, 72, 74, 76,  74, 72, 69, 0,
               69, 72, 76, 74,  72, 69, 67, 0,
               67, 74, 76, 74,  76, 74, 67, 0]
    };
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    let music = null;

    function pluck(midi, t, vol, dur, dest) {
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(midi);
      const o2 = ac.createOscillator(); o2.type = 'triangle'; o2.frequency.value = mtof(midi);
      const g = ac.createGain(), g2 = ac.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.008); g2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.6);
      o.connect(g); g.connect(dest); o2.connect(g2); g2.connect(dest);
      o.start(t); o.stop(t + dur + 0.05); o2.start(t); o2.stop(t + dur + 0.05);
    }
    function bassNote(midi, t, dur, dest) {
      const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(midi);
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(f); f.connect(g); g.connect(dest);
      o.start(t); o.stop(t + dur + 0.05);
    }
    function startMusic() {
      if (music || !ac) return;
      const bus = ac.createGain();
      bus.gain.value = 0.28;
      bus.connect(master);
      music = { bus, beat: 0, next: ac.currentTime + 0.15, spb: 60 / MUSIC.bpm, timer: setInterval(scheduleMusic, 60) };
    }
    function scheduleMusic() {
      if (!music || ac.state !== 'running') return;
      const spb = music.spb;
      while (music.next < ac.currentTime + 0.45) {
        const t = music.next;
        const b = music.beat % 32, bar = Math.floor(b / 4), ci = Math.floor(bar / 2);
        const chord = MUSIC.chords[ci];
        if (b % 4 === 0) bassNote(MUSIC.bass[ci], t, spb * 3.6, music.bus);
        const e = (b % 4) * 2;
        pluck(chord[MUSIC.arp[e]] + 12, t, 0.09, spb * 0.9, music.bus);
        pluck(chord[MUSIC.arp[e + 1]] + 12, t + spb / 2, 0.07, spb * 0.8, music.bus);
        const m = MUSIC.melody[b];
        if (m) pluck(m, t, 0.17, spb * 1.6, music.bus);
        music.next += spb;
        music.beat += 1;
      }
    }

    // Wind: a looping band of noise whose level follows the speed ramp.
    // It is the ambience, the difficulty meter, and the reason things fall.
    let wind = null, windLevel = 0, windT = 0;
    function startWind() {
      if (wind || !ac) return;
      try {
        const src = ac.createBufferSource();
        src.buffer = noise(); src.loop = true;
        const f = ac.createBiquadFilter();
        f.type = 'bandpass'; f.frequency.value = 380; f.Q.value = 0.6;
        const g = ac.createGain();
        g.gain.value = 0;
        src.connect(f); f.connect(g); g.connect(master);
        src.start();
        wind = { src, f, g };
      } catch (_) { wind = null; }
    }
    // level 0..1, called every frame; eases so changes never click.
    function setWind(level, dt) {
      if (!wind || ac.state !== 'running') return;
      windT += dt;
      windLevel += (level - windLevel) * Math.min(1, dt * 1.5);
      const sway = 0.75 + 0.25 * Math.sin(windT * 0.9) * Math.sin(windT * 0.37 + 1);
      const target = windLevel <= 0.001 ? 0.0001 : (0.025 + windLevel * 0.17) * sway;
      wind.g.gain.setTargetAtTime(target, ac.currentTime, 0.08);
      wind.f.frequency.setTargetAtTime(320 + windLevel * 520, ac.currentTime, 0.2);
    }

    function noise() {
      if (noiseBuf) return noiseBuf;
      const len = ac.sampleRate;
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return noiseBuf;
    }

    // A filtered noise burst with a fast attack and exponential decay.
    function burst({ type = 'bandpass', freq = 1000, q = 1, vol = 0.5, dur = 0.08, delay = 0 }) {
      const t = ac.currentTime + delay;
      const src = ac.createBufferSource();
      src.buffer = noise();
      const f = ac.createBiquadFilter();
      f.type = type; f.frequency.value = freq; f.Q.value = q;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t); src.stop(t + dur + 0.05);
    }

    // A tone that glides through a list of [timeOffset, frequency] points.
    function tone({ type = 'sine', points, vol = 0.4, dur, delay = 0, attack = 0.01 }) {
      const t = ac.currentTime + delay;
      const o = ac.createOscillator();
      o.type = type;
      o.frequency.setValueAtTime(points[0][1], t);
      for (let i = 1; i < points.length; i++) o.frequency.exponentialRampToValueAtTime(points[i][1], t + points[i][0]);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur + 0.05);
    }

    const lib = {
      // Tiny dry crunch. `pitch` is a multiplier so Day 3 can climb a scale.
      crunch(pitch = 1) {
        burst({ freq: 1600 * pitch, q: 0.9, vol: 0.55, dur: 0.07 });
        burst({ freq: 3800 * pitch, q: 1.2, vol: 0.25, dur: 0.045, delay: 0.012 });
      },
      // Branch lands on the squirrel.
      thud() {
        tone({ type: 'sine', points: [[0, 120], [0.18, 38]], vol: 0.9, dur: 0.24, attack: 0.004 });
        burst({ type: 'lowpass', freq: 320, q: 0.7, vol: 0.6, dur: 0.14 });
      },
      // The squirrel's reaction, more pathetic with every life lost:
      // 1 = surprised eek, 2 = longer whine, 3 = sad deflating squeak.
      squeak(level = 1) {
        if (level >= 3) {
          tone({ type: 'triangle', points: [[0, 1000], [0.15, 1100], [0.5, 520], [0.9, 330]], vol: 0.3, dur: 0.95, delay: 0.15, attack: 0.03 });
        } else if (level === 2) {
          tone({ type: 'triangle', points: [[0, 1200], [0.12, 880], [0.26, 1080], [0.5, 680]], vol: 0.3, dur: 0.52, delay: 0.12, attack: 0.02 });
        } else {
          tone({ type: 'triangle', points: [[0, 1050], [0.07, 1750], [0.2, 820]], vol: 0.32, dur: 0.22, delay: 0.12 });
        }
      },
      // A gust: swells just before a branch's shadow appears.
      gust() {
        const t = ac.currentTime;
        const src = ac.createBufferSource();
        src.buffer = noise();
        const f = ac.createBiquadFilter();
        f.type = 'bandpass'; f.Q.value = 0.8;
        f.frequency.setValueAtTime(300, t);
        f.frequency.exponentialRampToValueAtTime(950, t + 0.3);
        f.frequency.exponentialRampToValueAtTime(420, t + 0.75);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.38, t + 0.28);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
        src.connect(f); f.connect(g); g.connect(master);
        src.start(t); src.stop(t + 0.85);
      },
      // A crowd of squirrels cheering from the tree, with a rustle of leaves.
      cheer() {
        burst({ freq: 2600, q: 0.6, vol: 0.16, dur: 0.5 });
        for (let i = 0; i < 9; i++) {
          const f0 = 850 + Math.random() * 800;
          tone({ type: 'triangle', points: [[0, f0], [0.06, f0 * 1.5], [0.15, f0 * 1.15]],
                 vol: 0.11, dur: 0.17, delay: Math.random() * 1.0 });
        }
      },
      // Contented munching as the squirrel settles on its pile.
      // Golden acorn caught: a quick bright arpeggio.
      chime() {
        const notes = [880, 1108.7, 1318.5, 1760];
        notes.forEach((f, i) => {
          tone({ type: 'sine', points: [[0, f], [0.25, f]], vol: 0.22, dur: 0.32, delay: i * 0.07, attack: 0.005 });
          tone({ type: 'triangle', points: [[0, f * 2], [0.2, f * 2]], vol: 0.06, dur: 0.2, delay: i * 0.07, attack: 0.005 });
        });
      },
      // An acorn bouncing on the ground: a small dry tap, quieter each hop.
      tap(vol = 1) {
        burst({ type: 'lowpass', freq: 900, q: 0.8, vol: 0.22 * vol, dur: 0.05 });
      },
      // Rotten acorn eaten: a queasy wobble and a burble.
      blegh() {
        tone({ type: 'sawtooth', points: [[0, 300], [0.12, 220], [0.3, 260], [0.55, 140]], vol: 0.16, dur: 0.6, attack: 0.02 });
        for (let i = 0; i < 3; i++) burst({ type: 'lowpass', freq: 380, q: 1.2, vol: 0.25, dur: 0.09, delay: 0.1 + i * 0.13 });
      },
      munch() {
        for (let i = 0; i < 4; i++) {
          burst({ type: 'lowpass', freq: 520, q: 0.8, vol: 0.45 - i * 0.07, dur: 0.1, delay: 0.3 + i * 0.19 });
        }
        tone({ type: 'sine', points: [[0, 215], [0.9, 180]], vol: 0.1, dur: 1.0, delay: 0.3, attack: 0.15 });
      }
    };

    function play(name, arg) {
      if (!ac || ac.state !== 'running') return;
      try { lib[name](arg); } catch (_) { /* sound is never worth a crash */ }
    }

    return { unlock, play, wind: setWind, toggleMute, isMuted: () => muted };
  })();

  // Mute button: top-right, shown in every mode.
  const muteBtn = document.getElementById('muteBtn');
  muteBtn.textContent = SFX.isMuted() ? '🔇' : '🔊';
  muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    SFX.unlock();
    muteBtn.textContent = SFX.toggleMute() ? '🔇' : '🔊';
  });

  // ------------------------------------------------------------------
  // Spawning
  // ------------------------------------------------------------------
  function spawnAcorn() {
    const m = L.acornR * 2;
    let x = m + Math.random() * (L.trunkX - m * 2);
    // Textless tutorial: the first acorn lands on the squirrel for free,
    // the second falls one thumb-width to the side so the player drags by reflex.
    if (state.tut === 0) {
      x = state.sx;
      state.tut = 1;
    } else if (state.tut === 1) {
      const side = state.sx > W * 0.5 ? -1 : 1;
      x = Math.max(m, Math.min(L.trunkX - m, state.sx + side * L.S * 1.1));
      state.tut = 2;
    }
    // A rare golden acorn restores a life. Never during the tutorial, never
    // too early, never two close together, and never when already at the cap.
    const gold = state.tut === 2
      && state.t > TUNE.goldStart
      && state.t - state.lastGold > TUNE.goldMinGap
      && state.lives < TUNE.maxLives
      && Math.random() < TUNE.goldChance;
    if (gold) state.lastGold = state.t;
    // A rotten acorn looks almost right but gives the squirrel a stomach ache.
    const rotten = !gold && state.tut === 2
      && state.t > TUNE.rottenStart
      && state.t - state.lastRotten > TUNE.rottenMinGap
      && Math.random() < TUNE.rottenChance;
    if (rotten) state.lastRotten = state.t;
    state.acorns.push({
      x,
      y: -L.acornR * 2,
      vy: TUNE.acornSpeed * H * speedMul() * (gold ? 0.78 : 0.9 + Math.random() * 0.25),
      rot: Math.random() * Math.PI * 2,
      spin: gold ? 0.6 : (Math.random() - 0.5) * 3,
      gold,
      rotten,
      baseX: x,
      wob: Math.random() * Math.PI * 2   // golden acorns drift side to side
    });
  }
  function spawnBranch() {
    const half = L.branchW / 2;
    const landX = half + Math.random() * (L.trunkX - half * 2);
    const vy = TUNE.branchSpeed * H * speedMul();
    // Start high enough that the shadow gives a fair lead time.
    const startY = -(vy * 1.6);
    state.branches.push({ x: landX, y: startY, vy, startY });
    SFX.play('gust');   // gust first, then look up
  }

  // ------------------------------------------------------------------
  // Update
  // ------------------------------------------------------------------
  function squirrelBox() {
    const w = L.S * 0.62, h = L.S * 0.78;
    return { x: state.sx - w / 2, y: L.groundY - h, w, h };
  }
  function overlaps(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update(dt) {
    // Wind follows the speed ramp while playing and dies away at game over.
    SFX.wind(state.mode === 'playing' ? (speedMul() - 1) / (TUNE.maxMul - 1) : 0, dt);

    // The background keeps breathing except while paused.
    if (state.mode !== 'paused') updateBackground(dt);

    // Start screen and pause: the world holds still.
    if (state.mode === 'ready' || state.mode === 'paused') return;

    if (state.mode === 'gameover') {
      state.over.t += dt;
      // Walk to the pile and sit down on it.
      const target = L.pileX;
      const k = Math.min(1, state.over.t / 1.1);
      const ease = 1 - Math.pow(1 - k, 3);
      state.sx = state.over.fromX + (target - state.over.fromX) * ease;
      state.facing = target > state.over.fromX ? 1 : -1;
      // Let falling things finish falling, no catching.
      for (const a of state.acorns) a.y += a.vy * dt;
      for (const b of state.branches) b.y += b.vy * dt;
      state.acorns = state.acorns.filter(a => a.y < L.groundY + L.acornR * 3);
      state.branches = state.branches.filter(b => b.y < L.groundY + L.branchH);
      if (!state.over.munched && state.over.t > 1.0) {
        state.over.munched = true;
        SFX.play('munch');
      }
      if (!state.over.shown && state.over.t > 1.3) {
        state.over.shown = true;
        syncUI();
      }
      return;
    }

    state.t += dt;
    const mul = speedMul();

    // A rotten acorn leaves the squirrel sluggish for a few seconds.
    if (state.slow > 0) state.slow -= dt;
    const slowK = state.slow > 0 ? TUNE.slowFactor : 1;

    // Keyboard steering moves the target.
    if (state.keys.left !== state.keys.right) {
      const dir = state.keys.left ? -1 : 1;
      state.targetX += dir * TUNE.keySpeed * slowK * W * dt;
    }
    const half = L.S * 0.35;
    state.targetX = Math.max(half, Math.min(L.trunkX - half, state.targetX));

    // Follow lag: ease toward the target, frame-rate independent.
    if (state.knocked <= 0) {
      const prev = state.sx;
      const alpha = 1 - Math.exp(-TUNE.followLag * slowK * dt);
      state.sx += (state.targetX - state.sx) * alpha;
      state.vx = (state.sx - prev) / Math.max(dt, 1e-4);
      if (Math.abs(state.vx) > 12) state.facing = state.vx > 0 ? 1 : -1;
      state.runPhase += Math.min(Math.abs(state.vx), L.S * 8) / L.S * dt * 2.2;
    } else {
      state.knocked -= dt;
      if (state.knocked <= 0) {
        state.knocked = 0;
        state.invuln = TUNE.invuln;
        state.targetX = state.sx; // don't lurch after getting up
      }
    }
    if (state.invuln > 0) state.invuln -= dt;
    if (state.dance > 0) state.dance -= dt;
    if (state.sparkle > 0) state.sparkle -= dt;

    // Timers
    state.acornTimer -= dt;
    if (state.acornTimer <= 0) {
      spawnAcorn();
      state.acornTimer = (TUNE.acornInterval / mul) * (0.75 + Math.random() * 0.5);
    }
    state.branchTimer -= dt;
    if (state.branchTimer <= 0) {
      spawnBranch();
      state.branchTimer = (TUNE.branchInterval / Math.sqrt(mul)) * (0.8 + Math.random() * 0.5);
    }

    // Acorns
    const box = squirrelBox();
    const catchBox = state.knocked > 0 ? null : {
      x: box.x - L.S * 0.08, y: box.y - L.S * 0.1, w: box.w + L.S * 0.16, h: box.h * 0.75
    };
    // While knocked down the squirrel lies flat; acorns that land on it bounce off.
    const bellyBox = state.knocked > 0 ? {
      x: state.sx - L.S * 0.48, y: L.groundY - L.S * 0.46, w: L.S * 0.96, h: L.S * 0.46
    } : null;
    for (let i = state.acorns.length - 1; i >= 0; i--) {
      const a = state.acorns[i];
      if (a.bounced) {
        a.vy += H * 1.1 * dt;          // only bounced acorns feel gravity
        a.x += a.vx * dt;
      } else if (a.gold) {
        a.wob += dt * 2.4;
        a.x = a.baseX + Math.sin(a.wob) * L.S * 0.32;
      }
      a.y += a.vy * dt;
      a.rot += a.spin * dt;
      const ar = a.gold ? L.acornR * 1.3 : L.acornR;   // golden ones are bigger and a touch more forgiving
      const ab = { x: a.x - ar, y: a.y - ar, w: ar * 2, h: ar * 2 };
      if (!a.bounced && catchBox && overlaps(ab, catchBox)) {
        state.acorns.splice(i, 1);
        if (a.rotten) {
          // Stomach ache: slow for a while, streak gone, nothing for the pile.
          state.slow = TUNE.slowTime;
          state.streak = 0;
          SFX.play('blegh');
          continue;
        }
        state.pile = Math.min(TUNE.maxPile, state.pile + 1);
        state.streak += 1;
        if (a.gold) {
          state.lives = Math.min(TUNE.maxLives, state.lives + 1);
          state.maxLives = Math.max(state.maxLives, state.lives);
          state.sparkle = 0.8;
          SFX.play('chime');
        }
        // Each catch in a row climbs a semitone; a miss resets the scale.
        SFX.play('crunch', Math.pow(2, Math.min(state.streak - 1, 14) / 12));
        if (state.ghost > 0 && !state.ghostBuried && state.pile > state.ghost) {
          state.ghostBuried = true;
          state.dance = 1.1;   // victory dance, play continues underneath
          SFX.play('cheer');
        }
        continue;
      }
      if (!a.bounced && bellyBox && a.vy > 0 && overlaps(ab, bellyBox)) {
        a.bounced = true;
        a.vy = -Math.abs(a.vy) * 0.5;
        a.vx = (a.x < state.sx ? -1 : 1) * L.S * (1.2 + Math.random() * 1.2);
        a.spin = (Math.random() - 0.5) * 12;
        continue;
      }
      if (a.x < -L.S || a.x > W + L.S) {
        state.acorns.splice(i, 1);
        if (!a.rotten) missAcorn(a);
        continue;
      }
      if (a.y > L.groundY - L.acornR * 0.4) {
        if (a.rotten) { state.acorns.splice(i, 1); continue; }   // squish, gone, no harm done
        const hops = a.hops || 0;
        if (hops < 2 && a.vy > H * 0.12) {
          // Bounce: up and a little sideways, each hop smaller than the last.
          if (hops === 0) state.streak = 0;                        // the miss happened here
          a.y = L.groundY - L.acornR * 0.4;
          a.vy = -a.vy * 0.55;
          a.vx = (a.vx || 0) * 0.5 + (Math.random() - 0.5) * L.S * 1.4;
          a.spin = (Math.random() - 0.5) * 10;
          a.bounced = true;                                        // gravity on, catching off
          a.hops = hops + 1;
          SFX.play('tap', 1 - hops * 0.35);
        } else {
          state.acorns.splice(i, 1);
          if (hops === 0) state.streak = 0;
          missAcorn(a);          // it stays on the ground, and the ground creeps up
        }
      }
    }
    settleGround();

    // Branches
    for (let i = state.branches.length - 1; i >= 0; i--) {
      const b = state.branches[i];
      b.y += b.vy * dt;
      const bb = { x: b.x - L.branchW / 2, y: b.y - L.branchH / 2, w: L.branchW, h: L.branchH };
      if (state.knocked <= 0 && state.invuln <= 0 && overlaps(bb, box)) {
        state.branches.splice(i, 1);
        hit();
        continue;
      }
      if (b.y - L.branchH / 2 > L.groundY) state.branches.splice(i, 1);
    }
  }

  // A missed acorn lies where it fell. Positions are stored as fractions so a
  // resize keeps the litter in place.
  function missAcorn(a) {
    const x = Math.max(L.acornR, Math.min(W - L.acornR, a.x));
    state.litter.push({ fx: x / W, up: L.groundY0 - L.groundY + L.acornR * 0.15, gold: !!a.gold, rot: (Math.random() - 0.5) * 1.2 });
  }

  // The litter lifts the ground. When the squirrel would touch the canopy, it's buried.
  function groundLimit() { return L.canopyY + BG.r * 0.65 + L.S * 1.05; }
  function settleGround() {
    const maxRise = Math.max(0, L.groundY0 - groundLimit());
    state.rise = Math.min(maxRise, state.litter.length * (maxRise / TUNE.missesToFill));
    L.groundY = L.groundY0 - state.rise;
    if (state.mode === 'playing' && state.rise >= maxRise - 0.01) buried();
  }
  function buried() {
    state.mode = 'gameover';
    state.over.t = 0;
    state.over.fromX = state.sx;
    state.knocked = 0;
    state.dance = 0;
    SFX.play('squeak', 3);
  }

  function hit() {
    state.lives -= 1;
    state.dance = 0;
    state.streak = 0;
    SFX.play('thud');
    SFX.play('squeak', 3 - Math.max(0, state.lives));
    if (state.lives <= 0) {
      state.lives = 0;
      state.mode = 'gameover';
      state.over.t = 0;
      state.over.fromX = state.sx;
      state.knocked = 0;
      return;
    }
    state.knocked = TUNE.knockdown;
  }

  // ------------------------------------------------------------------
  // Drawing
  // ------------------------------------------------------------------
  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  const C = {};
  function cacheColors() {
    for (const k of ['sky-top','sky-bottom','ground','ground-dark','trunk','trunk-dark','leaf','leaf-dark','pile','pile-dark','ghost','ghost-line']) {
      C[k] = css('--' + k);
    }
  }

  // ------------------------------------------------------------------
  // Living background: clouds, a tree with branches, swaying leaf clusters,
  // acorns hanging in the canopy, and the odd leaf drifting down.
  // Purely decorative; nothing here can be caught or hit.
  // ------------------------------------------------------------------
  const BG = { clouds: [], clusters: [], hang: [], leaves: [], limbs: [], r: 60, leafTimer: 0 };
  let bgT = 0;

  function buildBackground() {
    const r = Math.max(50, Math.min(W * 0.16, H * 0.14));
    BG.r = r;
    BG.clusters = [];
    for (let x = -r * 0.2, i = 0; x < W + r; x += r * 0.9, i++) {
      BG.clusters.push({ x, y: L.canopyY - r * 0.35, r, phase: i * 1.7, dark: true });
    }
    for (let x = r * 0.25, i = 0; x < W + r; x += r * 0.9, i++) {
      BG.clusters.push({ x, y: L.canopyY - r * 0.6, r: r * 0.9, phase: i * 2.3 + 1, dark: false });
    }
    // Limbs reach out from the trunk just below the canopy, each with a tuft
    // of leaves at the tip, so the branches are visible and visibly swaying.
    BG.limbs = [
      { y: L.canopyY + r * 0.95, len: W * 0.40, lift: r * 0.45, w: L.trunkW * 0.42, tuft: r * 0.42, phase: 0.0 },
      { y: L.canopyY + r * 1.35, len: W * 0.26, lift: r * 0.30, w: L.trunkW * 0.32, tuft: r * 0.34, phase: 2.1 },
      { y: L.canopyY + r * 1.75, len: W * 0.15, lift: r * 0.18, w: L.trunkW * 0.26, tuft: r * 0.26, phase: 4.2 }
    ];
    BG.hang = [];
    const n = Math.max(4, Math.round(W / 120));
    for (let i = 0; i < n; i++) {
      BG.hang.push({ x: (i + 0.5 + Math.random() * 0.4) * (L.trunkX / n), y: L.canopyY + r * (0.45 + Math.random() * 0.25), phase: Math.random() * 6.28 });
    }
    BG.clouds = [];
    for (let i = 0; i < 3; i++) {
      BG.clouds.push({ x: Math.random() * W, y: L.canopyY + r * 0.8 + (L.groundY - L.canopyY) * (0.08 + i * 0.16), s: L.S * (0.55 + Math.random() * 0.4), v: 6 + Math.random() * 8 });
    }
    BG.leaves = [];
  }

  function updateBackground(dt) {
    bgT += dt;
    const windy = Math.max(0, Math.min(1, state.mode === 'playing' ? (speedMul() - 1) / (TUNE.maxMul - 1) : 0));
    for (const c of BG.clouds) {
      c.x += c.v * (1 + windy * 2) * dt;
      if (c.x - c.s * 2 > W) c.x = -c.s * 2;
    }
    BG.leafTimer -= dt;
    if (BG.leafTimer <= 0 && BG.leaves.length < 6) {
      BG.leaves.push({
        x: Math.random() * L.trunkX, y: L.canopyY + BG.r * 0.6,
        vy: H * (0.05 + Math.random() * 0.04), phase: Math.random() * 6.28, rot: Math.random() * 6.28,
        size: L.acornR * (0.6 + Math.random() * 0.5)
      });
      BG.leafTimer = 1.6 + Math.random() * 2.4 - windy * 1.2;
    }
    for (let i = BG.leaves.length - 1; i >= 0; i--) {
      const lf = BG.leaves[i];
      lf.phase += dt * 2.2;
      lf.y += lf.vy * (1 + windy * 0.6) * dt;
      lf.x += (Math.sin(lf.phase) * 28 + windy * 30) * dt;
      lf.rot += dt * 1.5;
      if (lf.y > L.groundY + 4) BG.leaves.splice(i, 1);
    }
  }

  function drawScene() {
    // Sky
    const sky = ctx.createLinearGradient(0, 0, 0, L.groundY);
    sky.addColorStop(0, C['sky-top']);
    sky.addColorStop(1, C['sky-bottom']);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Clouds drift behind everything.
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const c of BG.clouds) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.s * 0.55, 0, Math.PI * 2);
      ctx.arc(c.x + c.s * 0.55, c.y - c.s * 0.18, c.s * 0.65, 0, Math.PI * 2);
      ctx.arc(c.x + c.s * 1.2, c.y, c.s * 0.5, 0, Math.PI * 2);
      ctx.arc(c.x + c.s * 0.6, c.y + c.s * 0.2, c.s * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }

    // Trunk
    ctx.fillStyle = C['trunk'];
    ctx.fillRect(L.trunkX, L.canopyY, L.trunkW, L.groundY - L.canopyY + 4);
    ctx.fillStyle = C['trunk-dark'];
    ctx.fillRect(L.trunkX + L.trunkW * 0.65, L.canopyY, L.trunkW * 0.35, L.groundY - L.canopyY + 4);

    // Limbs sway a touch with the wind.
    const windy = state.mode === 'playing' ? (speedMul() - 1) / (TUNE.maxMul - 1) : 0;
    const sway = 1 + windy * 2.5;
    ctx.lineCap = 'round';
    for (let i = 0; i < BG.limbs.length; i++) {
      const lb = BG.limbs[i];
      const bend = Math.sin(bgT * 1.1 + lb.phase) * sway * lb.lift * 0.12;
      const tipX = L.trunkX - lb.len, tipY = lb.y - lb.lift + bend * 1.6;
      ctx.strokeStyle = C['trunk'];
      ctx.lineWidth = lb.w;
      ctx.beginPath();
      ctx.moveTo(L.trunkX + L.trunkW * 0.5, lb.y);
      ctx.quadraticCurveTo(L.trunkX - lb.len * 0.45, lb.y - lb.lift * 0.3 + bend, tipX, tipY);
      ctx.stroke();
      // A twig and a leafy tuft at the tip, swaying a little more than the limb.
      ctx.lineWidth = lb.w * 0.45;
      ctx.beginPath();
      ctx.moveTo(L.trunkX - lb.len * 0.55, lb.y - lb.lift * 0.45 + bend);
      ctx.lineTo(L.trunkX - lb.len * 0.62, lb.y - lb.lift * 0.45 - lb.tuft * 0.9 + bend * 1.3);
      ctx.stroke();
      const tx = Math.sin(bgT * 1.5 + lb.phase) * sway * lb.tuft * 0.12;
      ctx.fillStyle = C['leaf-dark'];
      ctx.beginPath(); ctx.arc(tipX + tx * 0.6, tipY - lb.tuft * 0.2, lb.tuft, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(L.trunkX - lb.len * 0.62 + tx * 0.5, lb.y - lb.lift * 0.45 - lb.tuft * 1.0 + bend * 1.3, lb.tuft * 0.75, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C['leaf'];
      ctx.beginPath(); ctx.arc(tipX - lb.tuft * 0.35 + tx, tipY - lb.tuft * 0.55, lb.tuft * 0.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(tipX + lb.tuft * 0.45 + tx, tipY - lb.tuft * 0.45, lb.tuft * 0.6, 0, Math.PI * 2); ctx.fill();
    }

    // Falling leaves live between the limbs and the canopy so they appear from under it.
    for (const lf of BG.leaves) drawLeaf(lf.x, lf.y, lf.size, lf.rot + Math.sin(lf.phase) * 0.6, C['leaf']);

    // The cheering crowd peeks out from behind the leaves during the dance.
    if (state.dance > 0) drawPeekers(L.canopyY + BG.r * 0.62);

    // Canopy: two layers of leaf clusters, each swaying on its own phase.
    for (const cl of BG.clusters) {
      const dx = Math.sin(bgT * 1.3 + cl.phase) * sway * cl.r * 0.045;
      const dy = Math.cos(bgT * 0.9 + cl.phase) * sway * cl.r * 0.02;
      ctx.fillStyle = cl.dark ? C['leaf-dark'] : C['leaf'];
      ctx.beginPath(); ctx.arc(cl.x + dx, cl.y + dy, cl.r, 0, Math.PI * 2); ctx.fill();
    }

    // Acorns hanging under the canopy, bobbing.
    for (const h of BG.hang) {
      const bob = Math.sin(bgT * 2 + h.phase) * (2 + windy * 4);
      const sx = Math.sin(bgT * 1.3 + h.phase) * sway * 2;
      ctx.strokeStyle = C['trunk-dark'];
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(h.x, h.y - L.acornR * 1.2); ctx.lineTo(h.x + sx, h.y + bob - L.acornR * 0.5); ctx.stroke();
      drawAcornShape(h.x + sx, h.y + bob, L.acornR * 0.55);
    }

    // Ground: grass at the bottom, and above it the litter of missed acorns
    // that slowly lifts the surface toward the canopy.
    ctx.fillStyle = C['ground'];
    ctx.fillRect(0, L.groundY0, W, H - L.groundY0);
    if (state.rise > 0.5) {
      ctx.fillStyle = '#7d5433';
      ctx.fillRect(0, L.groundY, W, L.groundY0 - L.groundY + 2);
      for (const lt of state.litter) {
        ctx.save();
        ctx.translate(lt.fx * W, L.groundY0 - lt.up);
        ctx.rotate(lt.rot);
        if (lt.gold) {
          ctx.fillStyle = '#e9b63a';
          ctx.beginPath(); ctx.arc(0, 0, L.acornR * 0.85, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#a66d10';
          ctx.beginPath(); ctx.arc(0, -L.acornR * 0.35, L.acornR * 0.66, Math.PI, 0); ctx.fill();
        } else {
          drawAcornShape(0, 0, L.acornR * 0.85);
        }
        ctx.restore();
      }
    }
    ctx.fillStyle = C['ground-dark'];
    ctx.fillRect(0, L.groundY, W, 4);
  }

  // The caught count sits on the pile itself; the ghost pile shows the friend's number in grey.
  function drawPileLabel(cx, n, ghost) {
    if (n <= 0) return;
    const r = pileRadius(n);
    const size = Math.max(14, Math.min(r * 0.95, L.S * 0.42, 34));
    ctx.save();
    ctx.font = `800 ${size}px "Segoe UI", system-ui, -apple-system, Roboto, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = size * 0.22;
    ctx.strokeStyle = ghost ? 'rgba(255,255,255,0.85)' : '#fff';
    ctx.fillStyle = ghost ? '#8c8c8c' : '#5e3b19';
    const y = L.groundY + 2 - Math.max(r * 0.55, size * 0.6);
    ctx.strokeText(String(n), cx, y);
    ctx.fillText(String(n), cx, y);
    ctx.restore();
  }

  function drawLeaf(x, y, size, rot, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(0, 0, size, size * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-size, 0); ctx.lineTo(size, 0); ctx.stroke();
    ctx.restore();
  }

  function drawPile(cx, n, ghost) {
    const r = pileRadius(n);
    if (r <= 0) return;
    const baseY = L.groundY + 2;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - r * 1.25, baseY);
    ctx.quadraticCurveTo(cx - r * 0.9, baseY - r * 1.05, cx, baseY - r * 1.15);
    ctx.quadraticCurveTo(cx + r * 0.9, baseY - r * 1.05, cx + r * 1.25, baseY);
    ctx.closePath();
    if (ghost) {
      ctx.fillStyle = C['ghost'];
      ctx.fill();
      ctx.setLineDash([6, 5]);
      ctx.strokeStyle = C['ghost-line'];
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
      return;
    }
    ctx.fillStyle = C['pile'];
    ctx.fill();
    ctx.clip();
    // Little acorn bumps so it reads as a heap, not a hill.
    ctx.fillStyle = C['pile-dark'];
    const step = Math.max(8, L.acornR * 1.1);
    let row = 0;
    for (let y = baseY - step * 0.5; y > baseY - r * 1.2; y -= step * 0.85, row++) {
      const off = (row % 2) * step * 0.5;
      for (let x = cx - r * 1.3 + off; x < cx + r * 1.3; x += step) {
        ctx.beginPath(); ctx.arc(x, y, step * 0.28, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawShadow(b) {
    // Progress 0..1 from spawn to landing; the shadow grows as it closes in.
    const p = Math.max(0, Math.min(1, (b.y - b.startY) / (L.groundY - b.startY)));
    const w = L.branchW * (0.45 + 0.65 * p);
    const h = L.branchH * (0.35 + 0.45 * p);
    ctx.save();
    ctx.globalAlpha = 0.18 + 0.4 * p;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(b.x, L.groundY + 3, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawGoldAcorn(r) {
    // Pulsing halo so it reads as special from across the screen.
    const pulse = 0.75 + 0.25 * Math.sin(state.t * 7);
    const halo = ctx.createRadialGradient(0, 0, r * 0.6, 0, 0, r * 2.6);
    halo.addColorStop(0, `rgba(255, 220, 90, ${0.55 * pulse})`);
    halo.addColorStop(1, 'rgba(255, 220, 90, 0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, r * 2.6, 0, Math.PI * 2); ctx.fill();
    // Body with a warm gradient, darker cap, white glint.
    const body = ctx.createRadialGradient(-r * 0.3, -r * 0.2, r * 0.1, 0, 0, r * 1.1);
    body.addColorStop(0, '#ffe489');
    body.addColorStop(1, '#d9961b');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(0, r * 0.1, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b8720f';
    ctx.beginPath(); ctx.arc(0, -r * 0.35, r * 0.8, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#8f5608';
    ctx.fillRect(-r * 0.09, -r * 1.3, r * 0.18, r * 0.35);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(-r * 0.35, r * 0.05, r * 0.2, 0, Math.PI * 2); ctx.fill();
    // Four-point sparkle that twinkles.
    const tw = 0.6 + 0.4 * Math.sin(state.t * 11 + 1);
    ctx.strokeStyle = `rgba(255,255,255,${tw})`;
    ctx.lineWidth = Math.max(1, r * 0.12);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(r * 1.3, -r * 1.2 - r * 0.45 * tw); ctx.lineTo(r * 1.3, -r * 1.2 + r * 0.45 * tw);
    ctx.moveTo(r * 1.3 - r * 0.45 * tw, -r * 1.2); ctx.lineTo(r * 1.3 + r * 0.45 * tw, -r * 1.2);
    ctx.stroke();
  }

  function drawRottenAcorn(r) {
    // Olive body, dark cap, mould spots, and little stink wiggles rising off it.
    ctx.fillStyle = '#8f9a4c';
    ctx.beginPath(); ctx.arc(0, r * 0.1, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#58602a';
    ctx.beginPath(); ctx.arc(0, -r * 0.35, r * 0.78, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#3f4620';
    ctx.beginPath(); ctx.arc(-r * 0.3, r * 0.3, r * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.35, r * 0.05, r * 0.14, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.05, r * 0.6, r * 0.11, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(120, 140, 60, 0.75)';
    ctx.lineWidth = Math.max(1, r * 0.12);
    ctx.lineCap = 'round';
    for (let i = -1; i <= 1; i += 2) {
      const ph = state.t * 4 + i;
      const x0 = i * r * 0.55, y0 = -r * 1.1;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.quadraticCurveTo(x0 + Math.sin(ph) * r * 0.35, y0 - r * 0.45, x0, y0 - r * 0.9);
      ctx.stroke();
    }
  }

  // Rotten acorns cast a faint shadow: the sneaky middle case between acorns and branches.
  function drawRottenShadow(a) {
    ctx.save();
    ctx.globalAlpha = 0.14;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(a.x, L.groundY + 3, L.acornR * 1.4, L.acornR * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawAcorn(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    if (a.gold) {
      ctx.rotate(Math.sin(a.wob) * 0.25);
      drawGoldAcorn(L.acornR * 1.15);
      ctx.restore();
      return;
    }
    if (a.rotten) {
      ctx.rotate(a.rot * 0.3);
      drawRottenAcorn(L.acornR * 1.05);
      ctx.restore();
      return;
    }
    ctx.rotate(a.rot * 0.3);
    if (emojiOK.acorn) {
      drawEmoji(ART.acorn, 0, 0, L.acornR * 2.4);
    } else {
      ctx.fillStyle = '#8a5a2b';
      ctx.beginPath(); ctx.arc(0, 0, L.acornR, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5e3b19';
      ctx.beginPath(); ctx.arc(0, -L.acornR * 0.45, L.acornR * 0.75, Math.PI, 0); ctx.fill();
    }
    ctx.restore();
  }

  function drawBranch(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    if (emojiOK.branch) {
      drawEmoji(ART.branch, 0, 0, L.branchW * 0.78);
    } else {
      ctx.fillStyle = '#6b3f1d';
      const w = L.branchW, h = L.branchH;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(-w / 2, -h / 2, w, h, h / 2) : ctx.rect(-w / 2, -h / 2, w, h);
      ctx.fill();
      ctx.fillStyle = '#4b2a12';
      ctx.fillRect(-w / 2 + w * 0.2, -h / 2, w * 0.08, h);
      ctx.fillRect(w / 2 - w * 0.3, -h / 2, w * 0.06, h);
    }
    ctx.restore();
  }

  // ------------------------------------------------------------------
  // The squirrel. Drawn in a local space where (0,0) is the point where
  // its feet touch the ground, facing right, S = overall size.
  // ------------------------------------------------------------------
  const FUR = '#d9803a', FUR_DARK = '#b5602a', FUR_LIGHT = '#efa964',
        BELLY = '#f7d9b0', INK = '#3b2314', PINK = '#f2a68e';

  function tailPath(S, wag) {
    // `wag` nudges the tip so the tail flicks while idle and swishes while running.
    ctx.beginPath();
    ctx.moveTo(-0.10 * S, -0.22 * S);
    ctx.bezierCurveTo(-0.50 * S, -0.20 * S, (-0.52 - wag * 0.4) * S, -0.98 * S, (-0.08 - wag) * S, (-0.96 + wag * 0.3) * S);
  }

  function drawAcornShape(x, y, r) {
    ctx.fillStyle = '#8a5a2b';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5e3b19';
    ctx.beginPath(); ctx.arc(x, y - r * 0.4, r * 0.78, Math.PI, 0); ctx.fill();
  }

  // pose: { run, kick, sitting, lives, mouthOpen }
  function drawSquirrelArt(S, pose) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Tail: a thick S-curve behind the body with a lighter core.
    const wag = pose.kick != null ? 0 : Math.sin(bgT * 2.6) * 0.05 + Math.sin(pose.run) * 0.06 + (pose.sick ? Math.sin(bgT * 9) * 0.03 : 0);
    ctx.strokeStyle = FUR_DARK; ctx.lineWidth = S * 0.19; tailPath(S, wag); ctx.stroke();
    ctx.strokeStyle = FUR;      ctx.lineWidth = S * 0.12; tailPath(S, wag); ctx.stroke();
    ctx.strokeStyle = FUR_LIGHT; ctx.lineWidth = S * 0.045; tailPath(S, wag); ctx.stroke();

    // Legs and feet. `run` swings them; `kick` flails them when knocked down.
    const swing = pose.kick != null ? Math.sin(pose.kick) * 0.16 : Math.sin(pose.run) * 0.07;
    const footY = pose.sitting ? -0.02 * S : -0.03 * S;
    const spread = pose.sitting ? 0.17 : 0.09;
    ctx.fillStyle = FUR_DARK;
    ctx.beginPath(); ctx.ellipse((-spread + swing) * S, footY, 0.10 * S, 0.045 * S, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = FUR;
    ctx.beginPath(); ctx.ellipse(( spread - swing) * S, footY, 0.10 * S, 0.045 * S, 0, 0, Math.PI * 2); ctx.fill();

    // Body and belly.
    const bodyY = pose.sitting ? -0.26 * S : -0.30 * S;
    const bodyRy = pose.sitting ? 0.24 * S : 0.27 * S;
    ctx.fillStyle = FUR;
    ctx.beginPath(); ctx.ellipse(0, bodyY, 0.23 * S, bodyRy, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BELLY;
    ctx.beginPath(); ctx.ellipse(0.06 * S, bodyY + 0.03 * S, 0.14 * S, bodyRy * 0.72, 0, 0, Math.PI * 2); ctx.fill();

    // Arms: reaching up and forward, or holding an acorn to the mouth when sitting.
    ctx.strokeStyle = FUR; ctx.lineWidth = S * 0.055;
    if (pose.sitting) {
      ctx.beginPath(); ctx.moveTo(0.12 * S, -0.36 * S); ctx.lineTo(0.27 * S, -0.44 * S); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0.10 * S, -0.30 * S); ctx.lineTo(0.28 * S, -0.40 * S); ctx.stroke();
      drawAcornShape(0.31 * S, -0.44 * S, 0.055 * S);
    } else {
      ctx.beginPath(); ctx.moveTo(0.12 * S, -0.40 * S); ctx.lineTo(0.26 * S, -0.50 * S); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0.10 * S, -0.34 * S); ctx.lineTo(0.25 * S, -0.43 * S); ctx.stroke();
      ctx.fillStyle = FUR_DARK;
      ctx.beginPath(); ctx.arc(0.27 * S, -0.51 * S, 0.03 * S, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(0.26 * S, -0.44 * S, 0.03 * S, 0, Math.PI * 2); ctx.fill();
    }

    // Head.
    const hx = 0.15 * S, hy = pose.sitting ? -0.56 * S : -0.60 * S;
    ctx.fillStyle = FUR;
    ctx.beginPath(); ctx.arc(hx, hy, 0.17 * S, 0, Math.PI * 2); ctx.fill();
    // Ear.
    ctx.beginPath(); ctx.arc(hx - 0.09 * S, hy - 0.15 * S, 0.06 * S, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = PINK;
    ctx.beginPath(); ctx.arc(hx - 0.09 * S, hy - 0.15 * S, 0.03 * S, 0, Math.PI * 2); ctx.fill();
    // Snout.
    ctx.fillStyle = BELLY;
    ctx.beginPath(); ctx.arc(hx + 0.12 * S, hy + 0.04 * S, 0.085 * S, 0, Math.PI * 2); ctx.fill();
    // Cheek with the lives tucked in. Bigger cheek for more acorns.
    const lives = pose.lives || 0;
    if (lives > 0) {
      ctx.fillStyle = '#f1c08f';
      ctx.beginPath(); ctx.arc(hx + 0.07 * S, hy + 0.09 * S, (0.055 + lives * 0.02) * S, 0, Math.PI * 2); ctx.fill();
      const spots = [[0.05, 0.11], [0.11, 0.13], [0.02, 0.15], [0.09, 0.07], [0.13, 0.18]];
      for (let i = 0; i < Math.min(lives, spots.length); i++) {
        drawAcornShape(hx + spots[i][0] * S, hy + spots[i][1] * S, 0.038 * S);
      }
    }
    // Nose and mouth.
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(hx + 0.185 * S, hy + 0.02 * S, 0.028 * S, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = S * 0.014;
    ctx.beginPath();
    if (pose.mouthOpen) {
      ctx.arc(hx + 0.15 * S, hy + 0.08 * S, 0.03 * S, 0, Math.PI);
    } else {
      ctx.arc(hx + 0.155 * S, hy + 0.055 * S, 0.035 * S, 0.15 * Math.PI, 0.75 * Math.PI);
    }
    ctx.stroke();
    // Eye. Blinks every few seconds; squeezed shut and watery when sick.
    const blink = pose.kick == null && ((bgT % 3.7) < 0.12);
    if (blink || pose.sick) {
      ctx.strokeStyle = INK; ctx.lineWidth = S * 0.02;
      ctx.beginPath();
      if (pose.sick) ctx.arc(hx + 0.055 * S, hy - 0.03 * S, 0.04 * S, Math.PI * 1.15, Math.PI * 1.85);
      else { ctx.moveTo(hx + 0.01 * S, hy - 0.045 * S); ctx.lineTo(hx + 0.1 * S, hy - 0.045 * S); }
      ctx.stroke();
    } else {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(hx + 0.05 * S, hy - 0.045 * S, 0.048 * S, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(hx + 0.065 * S, hy - 0.045 * S, 0.03 * S, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(hx + 0.075 * S, hy - 0.058 * S, 0.011 * S, 0, Math.PI * 2); ctx.fill();
    }
    if (pose.sick) {
      // A green tinge on the cheeks and a couple of sweat drops.
      ctx.fillStyle = 'rgba(120, 170, 80, 0.35)';
      ctx.beginPath(); ctx.arc(hx + 0.04 * S, hy + 0.06 * S, 0.11 * S, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7fc7ff';
      const dripY = (bgT * 1.7) % 1;
      ctx.beginPath(); ctx.arc(hx - 0.12 * S, hy - 0.1 * S + dripY * 0.12 * S, 0.025 * S, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(hx - 0.02 * S, hy - 0.2 * S + ((dripY + 0.5) % 1) * 0.1 * S, 0.02 * S, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Small squirrel heads bobbing out from under the canopy while the crowd cheers.
  function drawPeekers(edgeY) {
    const p = 1.1 - state.dance;                 // 0..1.1 through the dance
    const r = L.S * 0.17;
    const spots = [0.12, 0.33, 0.56, 0.78];
    for (let i = 0; i < spots.length; i++) {
      const phase = Math.max(0, Math.min(1, (p - i * 0.08) / 0.8));
      if (phase <= 0) continue;
      const poke = Math.sin(phase * Math.PI) * r * 2.1;    // down then back up
      const x = spots[i] * (L.trunkX - r * 2) + r;
      const y = edgeY - r * 1.4 + poke;
      const flip = i % 2 === 1;
      ctx.save();
      ctx.translate(x, y);
      if (flip) ctx.scale(-1, 1);
      ctx.fillStyle = FUR;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-r * 0.55, -r * 0.85, r * 0.36, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = PINK;
      ctx.beginPath(); ctx.arc(-r * 0.55, -r * 0.85, r * 0.18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = BELLY;
      ctx.beginPath(); ctx.arc(r * 0.7, r * 0.25, r * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(r * 1.08, r * 0.12, r * 0.17, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(r * 0.3, -r * 0.25, r * 0.28, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(r * 0.38, -r * 0.25, r * 0.17, 0, Math.PI * 2); ctx.fill();
      // Open cheering mouth.
      ctx.beginPath(); ctx.arc(r * 0.75, r * 0.5, r * 0.18, 0, Math.PI); ctx.fill();
      ctx.restore();
    }
  }

  function drawSquirrel() {
    const S = L.S;
    const sitting = state.mode === 'gameover';
    let gy = L.groundY + 2;   // feet on the ground
    if (sitting) {
      // Perch on top of the pile once we've walked there.
      const k = Math.min(1, state.over.t / 1.1);
      gy -= pileRadius(state.pile) * 1.05 * k;
    }

    // Blink while invulnerable.
    if (state.invuln > 0 && Math.floor(state.invuln * 14) % 2 === 0) return;

    ctx.save();
    ctx.translate(state.sx, gy);

    if (state.dance > 0) {
      // Victory hop with a wiggle; play goes on underneath.
      const p = (1.1 - state.dance);
      const hop = Math.abs(Math.sin(p * Math.PI * 4)) * S * 0.22;
      ctx.translate(0, -hop);
      ctx.rotate(Math.sin(p * Math.PI * 8) * 0.18);
    }

    const pose = {
      run: state.runPhase * Math.PI * 2,
      kick: null,
      sitting,
      lives: sitting ? 0 : state.lives,
      sick: state.slow > 0 && !sitting,
      mouthOpen: state.knocked > 0 || state.slow > 0 || (sitting && Math.floor(state.over.t * 6) % 2 === 0)
    };
    if (pose.sick) ctx.rotate(Math.sin(bgT * 9) * 0.04);   // queasy wobble

    if (state.knocked > 0) {
      // Flat on the back, belly up, legs flailing in the air.
      pose.kick = state.knocked * 22;
      ctx.translate(0, -S * 0.22);
      ctx.rotate(state.facing < 0 ? Math.PI / 2 : -Math.PI / 2);
      if (state.facing < 0) ctx.scale(-1, 1);
    } else if (state.facing < 0) {
      ctx.scale(-1, 1);
    }

    drawSquirrelArt(S, pose);
    ctx.restore();

    if (state.sparkle > 0) drawSparkle(state.sx, gy - S * 0.5, S);
  }

  // Gold motes radiating from the squirrel after a golden acorn.
  function drawSparkle(cx, cy, S) {
    const p = 1 - state.sparkle / 0.8;           // 0 → 1 over the effect
    ctx.save();
    ctx.globalAlpha = 1 - p;
    for (let i = 0; i < 10; i++) {
      const ang = i / 10 * Math.PI * 2 + p * 0.8;
      const d = S * (0.35 + p * 0.9);
      const x = cx + Math.cos(ang) * d, y = cy + Math.sin(ang) * d * 0.8 - p * S * 0.3;
      const r = S * 0.05 * (1 - p * 0.6);
      ctx.fillStyle = i % 2 ? '#ffd84a' : '#fff4bf';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function draw() {
    drawScene();

    // Piles behind everything else. The ghost sits beside the tree.
    const buried = state.ghost > 0 && state.pile > state.ghost;
    if (state.ghost > 0 && !buried) drawPile(L.ghostX, state.ghost, true);
    drawPile(L.pileX, state.pile, false);
    // Once the real pile is bigger, it visually swallows the ghost.
    if (buried) drawPile(L.ghostX, state.ghost, false);
    if (state.ghost > 0 && !buried) drawPileLabel(L.ghostX, state.ghost, true);
    drawPileLabel(L.pileX, state.pile, false);

    for (const b of state.branches) drawShadow(b);
    for (const a of state.acorns) if (a.rotten && !a.bounced) drawRottenShadow(a);
    drawSquirrel();
    for (const a of state.acorns) drawAcorn(a);
    for (const b of state.branches) drawBranch(b);

    if (state.mode === 'gameover' && state.over.shown) {
      // Soft dim so the buttons read; the pile stays the hero.
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(0, 0, W, H);
      drawGameOver();
    } else if (state.mode === 'paused') {
      // Stronger dim so a frozen scene reads as paused, not stuck.
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // "Game Over" pops in above the squirrel once it has settled on its pile.
  function drawGameOver() {
    const k = Math.min(1, (state.over.t - 1.3) / 0.45);
    const scale = 0.6 + 0.4 * (1 - Math.pow(1 - k, 3)) + (k < 1 ? Math.sin(k * Math.PI) * 0.12 : 0);
    const size = Math.min(W * 0.13, 64);
    ctx.save();
    ctx.translate(W / 2, H * 0.36);
    ctx.scale(scale, scale);
    ctx.globalAlpha = Math.min(1, k * 1.5);
    ctx.font = `800 ${size}px "Segoe UI", system-ui, -apple-system, Roboto, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = size * 0.18;
    ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.strokeText('GAME OVER', 0, 0);
    ctx.fillStyle = INK;
    ctx.fillText('GAME OVER', 0, 0);
    ctx.restore();
  }

  // ------------------------------------------------------------------
  // Loop
  // ------------------------------------------------------------------
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05; // tab switches and hiccups don't teleport things
    update(dt);
    draw();
    updateHud();
    requestAnimationFrame(frame);
  }

  document.addEventListener('visibilitychange', () => {
    last = performance.now();
    if (document.hidden) pauseGame();   // switching apps mid-run should not cost a life
  });
  window.addEventListener('blur', () => pauseGame());

  // Boot
  cacheColors();
  detectEmoji();
  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
