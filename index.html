<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hungry Squirrel</title>
<style>
  :root {
    --sky-top: #bfe6ff;
    --sky-bottom: #eaf7ff;
    --ground: #6fa84f;
    --ground-dark: #4f8536;
    --trunk: #7a4b25;
    --trunk-dark: #5a361a;
    --leaf: #3f9a46;
    --leaf-dark: #2f7a37;
    --pile: #8a5a2b;
    --pile-dark: #5e3b19;
    --ghost: rgba(120, 120, 120, 0.35);
    --ghost-line: rgba(80, 80, 80, 0.5);
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--sky-bottom);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  #ui {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: none;
    justify-content: center;
    align-items: center;
    gap: 18px;
    padding: 0 16px calc(28px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  #ui.show { display: flex; }
  .btn {
    pointer-events: auto;
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 0;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    font-size: 34px;
    line-height: 72px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .btn:active { transform: scale(0.94); }
  .btn.ok { background: #d9f7d3; }
  #center {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    pointer-events: none;
  }
  #center.show { display: flex; }
  /* Pill buttons with a word on them: Start on the splash, Resume when paused. */
  .btn.text {
    width: auto; height: 68px;
    padding: 0 38px;
    border-radius: 34px;
    background: #ffd84a;
    color: #3b2314;
    font: 800 26px/68px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: 0.04em;
    white-space: nowrap;
    box-shadow: 0 8px 22px rgba(0,0,0,0.35), 0 0 30px rgba(255,216,74,0.25), inset 0 -4px 0 rgba(0,0,0,0.12);
  }
  .btn.text:active { box-shadow: 0 3px 10px rgba(0,0,0,0.2); }
  /* Splash: logo, loading animation, then the Start button. Covers the scene
     while Three.js builds it and fades away when the game starts. */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    box-sizing: border-box;
    background: radial-gradient(circle at 50% 24%, #1f4a3a 0%, #122c2b 45%, #0a151e 100%);   /* night under the tree */
    overflow: hidden;
    transition: opacity 0.55s ease, visibility 0.55s;
  }
  #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #splash.hide * { animation-play-state: paused; }
  /* Acorns drift down behind the logo the whole time the splash is up. */
  #splash .rain { position: absolute; inset: 0; pointer-events: none; }
  #splash .rain svg {
    position: absolute;
    top: -60px;
    width: 26px; height: 32px;
    opacity: 0.4;
    animation: rainfall 7s linear infinite;
  }
  #splash .rain svg:nth-child(1) { left: 8%;  animation-duration: 7.5s; animation-delay: -1s; }
  #splash .rain svg:nth-child(2) { left: 22%; animation-duration: 9s;   animation-delay: -5s; width: 20px; height: 25px; }
  #splash .rain svg:nth-child(3) { left: 38%; animation-duration: 8s;   animation-delay: -3s; }
  #splash .rain svg:nth-child(4) { left: 55%; animation-duration: 10s;  animation-delay: -7s; width: 18px; height: 22px; }
  #splash .rain svg:nth-child(5) { left: 70%; animation-duration: 7s;   animation-delay: -2s; }
  #splash .rain svg:nth-child(6) { left: 84%; animation-duration: 9.5s; animation-delay: -6s; width: 22px; height: 27px; }
  #splash .rain svg:nth-child(7) { left: 93%; animation-duration: 8.5s; animation-delay: -4s; }
  @keyframes rainfall {
    0%   { transform: translateY(0) rotate(-20deg); }
    100% { transform: translateY(calc(100vh + 120px)) rotate(340deg); }
  }
  #splash .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    animation: logoin 0.9s cubic-bezier(0.2, 1.4, 0.4, 1) both;
  }
  #splash .badge { position: relative; animation: floaty 3.2s ease-in-out infinite; }
  #splash .logo svg {
    width: min(44vw, 200px);
    height: auto;
    display: block;
    filter: drop-shadow(0 0 28px rgba(140, 230, 120, 0.35)) drop-shadow(0 12px 18px rgba(0, 0, 0, 0.45));
    overflow: visible;
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }
  /* The squirrel on the badge is alive: it breathes, wags, tilts, blinks and chatters. */
  #splash .logo svg .sq, #splash .logo svg .tail, #splash .logo svg .head,
  #splash .logo svg .eyes, #splash .logo svg .mouth, #splash .logo svg .belly, #splash .logo svg .held {
    transform-box: fill-box;
  }
  #splash .logo svg .sq   { transform-origin: 50% 100%; animation: breathe 1.6s ease-in-out infinite; }
  #splash .logo svg .tail { transform-origin: 90% 95%;  animation: wag 1.1s ease-in-out infinite; }
  #splash .logo svg .head { transform-origin: 50% 90%;  animation: tilt 2.6s ease-in-out infinite; }
  #splash .logo svg .eyes { transform-origin: 50% 50%;  animation: blink 3.8s infinite; }
  #splash .logo svg .mouth { transform-origin: 50% 0%;  animation: chatter 0.32s ease-in-out infinite alternate; }
  #splash .logo svg .belly { transform-origin: 50% 50%; animation: rumble 2.8s ease-in-out infinite; }
  #splash .logo svg .held  { transform-origin: 50% 50%; animation: wobble 1.3s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.02, 1.04); } }
  @keyframes wag     { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  @keyframes tilt    { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes blink   { 0%, 90%, 100% { transform: scaleY(1); } 93%, 97% { transform: scaleY(0.08); } }
  @keyframes chatter { 0% { transform: scaleY(0.5); } 100% { transform: scaleY(2.2); } }
  @keyframes rumble  { 0%, 68%, 84%, 100% { transform: scale(1); } 72%, 80% { transform: scale(1.06, 0.95); } 76% { transform: scale(0.96, 1.05); } }
  @keyframes wobble  { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  /* The speech bubble: "I'm hungry..." then "Feed me!", over and over. */
  #splash .bubble {
    position: absolute;
    left: 78%;
    top: -4%;
    padding: 10px 16px;
    border-radius: 18px;
    background: #fff;
    color: #3b2314;
    font: 800 clamp(15px, 4vw, 20px)/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    white-space: nowrap;
    box-shadow: 0 8px 18px rgba(0,0,0,0.16);
    transform-origin: 0% 100%;
    animation: bubble 7s ease-in-out infinite;
  }
  #splash .bubble::after {
    content: "";
    position: absolute;
    left: 10px;
    bottom: -9px;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 11px solid #fff;
    transform: rotate(18deg);
  }
  #splash .bubble span { display: block; animation: say1 7s ease-in-out infinite; }
  #splash .bubble span + span {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    animation-name: say2;
  }
  @keyframes bubble {
    0%, 2%   { transform: scale(0.5); opacity: 0; }
    7%       { transform: scale(1.1); opacity: 1; }
    11%, 46% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(0.9); }
    55%      { transform: scale(1.1); }
    59%, 92% { transform: scale(1); opacity: 1; }
    100%     { transform: scale(0.5); opacity: 0; }
  }
  @keyframes say1 {
    0%, 4%    { opacity: 0; transform: translateY(5px); }
    9%, 44%   { opacity: 1; transform: none; }
    49%, 100% { opacity: 0; transform: translateY(-5px); }
  }
  @keyframes say2 {
    0%, 51%  { opacity: 0; transform: translateY(5px); }
    57%, 91% { opacity: 1; transform: none; }
    96%, 100% { opacity: 0; transform: translateY(-5px); }
  }
  @media (max-width: 420px) {
    #splash .bubble { left: 70%; top: -10%; }
  }
  #splash h1 {
    margin: 6px 0 0;
    text-align: center;
    text-transform: uppercase;
    font: 900 clamp(26px, 8.5vw, 50px)/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: 0.03em;
    text-shadow: 0 3px 0 rgba(0,0,0,0.55), 0 10px 22px rgba(0,0,0,0.5);
  }
  #splash h1 .w1 { display: block; color: #f0b26a; }
  #splash h1 .w2 { display: block; color: #8fe07a; font-size: 1.2em; margin-top: 0.08em; }
  @keyframes logoin {
    0%   { transform: translateY(24px) scale(0.7); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  #splash .stage {
    position: relative;
    width: 100%;
    height: 118px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #splash .loader {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: opacity 0.35s ease;
  }
  #splash.loaded .loader { opacity: 0; pointer-events: none; }
  #splash .loader .acorns { display: flex; gap: 12px; height: 54px; align-items: flex-end; }
  #splash .loader .acorns svg {
    width: 28px; height: 34px;
    animation: bounce 0.95s ease-in-out infinite;
    transform-origin: 50% 100%;
  }
  #splash .loader .acorns svg:nth-child(2) { animation-delay: 0.16s; }
  #splash .loader .acorns svg:nth-child(3) { animation-delay: 0.32s; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    35%      { transform: translateY(-18px) scale(0.94, 1.08); }
    60%      { transform: translateY(0) scale(1.12, 0.86); }
    75%      { transform: translateY(-3px) scale(1, 1); }
  }
  #splash .loader .bar {
    width: min(60vw, 220px); height: 10px;
    border-radius: 5px;
    background: rgba(255,255,255,0.18);
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  #splash .loader .bar i {
    display: block;
    width: 40%; height: 100%;
    border-radius: 5px;
    background: linear-gradient(90deg, #d19a56, #ffd84a);
    animation: slide 1.3s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(260%); }
  }
  #splash .loader .ltxt {
    font: 700 14px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #e8f3e4;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.8;
  }
  #startBtn { display: none; }
  #splash.loaded #startBtn { display: block; animation: popin 0.5s cubic-bezier(0.2, 1.5, 0.4, 1) both; }
  @keyframes popin {
    0%   { transform: scale(0.4); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  #splash .hint {
    font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #e8f3e4;
    opacity: 0.75;
    text-align: center;
    max-width: 300px;
  }
  #pauseBtn {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: 14px;
    width: 52px; height: 52px;
    line-height: 52px;
    font-size: 24px;
    display: none;
    pointer-events: auto;
    background: rgba(255,255,255,0.75);
  }
  #pauseBtn.show { display: block; }
  #muteBtn {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    right: 14px;
    width: 52px; height: 52px;
    line-height: 52px;
    font-size: 22px;
    pointer-events: auto;
    background: rgba(255,255,255,0.75);
  }
  #hud {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: 80px;
    display: none;
    gap: 10px;
    pointer-events: none;
  }
  #hud.show { display: flex; }
  #hud.nopause { left: 14px; }   /* no pause button to sit beside at game over */
  .stat {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 52px;
    padding: 0 16px 0 12px;
    border-radius: 26px;
    background: rgba(255,255,255,0.75);
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    font: 700 22px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    color: #3b2314;
  }
  .stat .ico {
    position: relative;
    font-size: 22px;
    line-height: 1;
    font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  }
  .stat.hearts { gap: 3px; padding: 0 12px; }
  .stat.hearts .h {
    font-size: 24px;
    line-height: 1;
    color: #e0433c;
    transition: color 0.25s ease, transform 0.25s ease;
  }
  .stat.hearts .h.lost { color: #b9b0a8; }
  .stat.hearts .h.pop { animation: heartpop 0.45s ease; }
  .stat.hearts .h.gain { animation: heartgain 0.6s ease; }
  @keyframes heartgain {
    0%   { transform: scale(0.2); color: #ffd84a; }
    50%  { transform: scale(1.6); color: #ffd84a; }
    100% { transform: scale(1); }
  }
  @keyframes heartpop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.5) rotate(-12deg); }
    100% { transform: scale(1); }
  }
  @media (max-width: 420px) {
    #hud { gap: 7px; }
    .stat { height: 46px; padding: 0 12px 0 10px; font-size: 19px; border-radius: 23px; }
    .stat .ico { font-size: 19px; }
    .stat.hearts { padding: 0 10px; }
    .stat.hearts .h { font-size: 21px; }
  }
  #linkbox {
    position: fixed;
    left: 16px; right: 16px;
    bottom: calc(116px + env(safe-area-inset-bottom));
    display: none;
    pointer-events: auto;
  }
  #linkbox.show { display: block; }
  #linkbox input {
    width: 100%;
    box-sizing: border-box;
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.15);
    background: rgba(255,255,255,0.95);
    -webkit-user-select: text;
    user-select: text;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="overlay"></canvas>

<div id="center">
  <button class="btn text" id="playBtn" aria-label="Resume">▶&nbsp; Resume</button>
</div>
<button class="btn" id="pauseBtn" aria-label="Pause">⏸</button>
<button class="btn" id="muteBtn" aria-label="Sound on or off">🔊</button>
<div id="hud" aria-live="off">
  <span class="stat hearts" id="heartsStat" title="Lives"><span class="h">♥</span><span class="h">♥</span><span class="h">♥</span></span>
</div>

<div id="ui">
  <button class="btn" id="shareBtn" aria-label="Copy share link">🔗</button>
  <button class="btn" id="replayBtn" aria-label="Play again">🔁</button>
</div>
<div id="linkbox"><input id="linkInput" type="text" readonly></div>

<div id="splash">
  <div class="rain" aria-hidden="true">
    <svg><use href="#acornSym"/></svg><svg><use href="#acornSym"/></svg><svg><use href="#acornSym"/></svg>
    <svg><use href="#acornSym"/></svg><svg><use href="#acornSym"/></svg><svg><use href="#acornSym"/></svg>
    <svg><use href="#acornSym"/></svg>
  </div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="acornSym" viewBox="0 0 30 36">
      <path d="M15 35 C7.5 35 4 27 4 17 L26 17 C26 27 22.5 35 15 35 Z" fill="#9c6633"/>
      <path d="M15 24 C11 24 8 28 7.5 32" fill="none" stroke="#7d4f24" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <path d="M15 3 C6 3 2.5 10 2.5 17.5 Q15 14 27.5 17.5 C27.5 10 24 3 15 3 Z" fill="#6b4522"/>
      <path d="M2.5 17.5 Q15 14 27.5 17.5" fill="none" stroke="#56361a" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="13.4" y="0" width="3.2" height="6" rx="1.6" fill="#4f3218"/>
    </symbol>
  </svg>
  <div class="logo">
    <div class="badge">
    <svg viewBox="0 0 200 200" aria-label="Hungry Squirrel logo" role="img">
      <defs>
        <radialGradient id="lgBadge" cx="50%" cy="32%" r="72%">
          <stop offset="0" stop-color="#8be07f"/>
          <stop offset="1" stop-color="#2f7a37"/>
        </radialGradient>
        <clipPath id="lgClip"><circle cx="100" cy="100" r="86"/></clipPath>
      </defs>
      <circle cx="100" cy="100" r="95" fill="#fff"/>
      <circle cx="100" cy="100" r="86" fill="url(#lgBadge)"/>
      <g clip-path="url(#lgClip)">
        <path d="M0 150 Q100 122 200 150 L200 200 L0 200 Z" fill="#4f8536"/>
        <path d="M0 158 Q100 136 200 158 L200 200 L0 200 Z" fill="#3f6f2b" opacity="0.55"/>
      </g>
      <g class="sq">
        <g class="tail">
          <path d="M78 150 C36 156 20 108 44 76 C62 52 94 56 92 82 C74 82 62 98 66 116 C70 132 82 142 96 140 Z" fill="#8a4f22"/>
          <path d="M56 82 C44 100 46 124 66 136" fill="none" stroke="#d19a56" stroke-width="8" stroke-linecap="round"/>
        </g>
        <ellipse cx="114" cy="128" rx="33" ry="34" fill="#a0622d"/>
        <ellipse class="belly" cx="116" cy="134" rx="20" ry="25" fill="#f0d2a8"/>
        <ellipse cx="98" cy="160" rx="14" ry="7" fill="#7a4b25"/>
        <ellipse cx="130" cy="160" rx="14" ry="7" fill="#7a4b25"/>
        <g class="held">
          <path d="M116 142 C107 142 103 134 103 124 L129 124 C129 134 125 142 116 142 Z" fill="#9c6633"/>
          <path d="M116 108 C106 108 102 115 102 124 Q116 120 130 124 C130 115 126 108 116 108 Z" fill="#6b4522"/>
          <rect x="114.2" y="104" width="3.6" height="7" rx="1.8" fill="#4f3218"/>
          <circle cx="103" cy="128" r="7.5" fill="#a0622d"/>
          <circle cx="129" cy="128" r="7.5" fill="#a0622d"/>
        </g>
        <g class="head">
          <ellipse cx="98" cy="60" rx="11" ry="15" fill="#a0622d"/>
          <ellipse cx="138" cy="60" rx="11" ry="15" fill="#a0622d"/>
          <ellipse cx="98" cy="62" rx="5" ry="8" fill="#f2b8a2"/>
          <ellipse cx="138" cy="62" rx="5" ry="8" fill="#f2b8a2"/>
          <circle cx="118" cy="84" r="28" fill="#a0622d"/>
          <ellipse cx="118" cy="97" rx="15" ry="11" fill="#f0d2a8"/>
          <g class="eyes">
            <circle cx="106" cy="80" r="6" fill="#2b1a10"/>
            <circle cx="130" cy="80" r="6" fill="#2b1a10"/>
            <circle cx="108" cy="78" r="2.2" fill="#fff"/>
            <circle cx="132" cy="78" r="2.2" fill="#fff"/>
          </g>
          <circle cx="118" cy="92" r="4.5" fill="#2b1a10"/>
          <ellipse class="mouth" cx="118" cy="102" rx="4.5" ry="2.6" fill="#2b1a10"/>
          <circle cx="96" cy="94" r="5" fill="#f2a08a" opacity="0.8"/>
          <circle cx="140" cy="94" r="5" fill="#f2a08a" opacity="0.8"/>
        </g>
      </g>
    </svg>
    <div class="bubble" aria-hidden="true"><span>I'm hungry…</span><span>Feed me!</span></div>
    </div>
    <h1><span class="w1">Hungry</span><span class="w2">Squirrel</span></h1>
  </div>
  <div class="stage">
    <div class="loader" id="loader" aria-live="polite">
      <div class="acorns">
        <svg><use href="#acornSym"/></svg>
        <svg><use href="#acornSym"/></svg>
        <svg><use href="#acornSym"/></svg>
      </div>
      <div class="bar"><i></i></div>
      <div class="ltxt">Loading…</div>
    </div>
    <button class="btn text" id="startBtn" aria-label="Start">▶&nbsp; Start</button>
  </div>
  <div class="hint">Drag or use ← → to run. Catch acorns, dodge branches.</div>
</div>

<script src="three.min.js"></script>
<script>if (!window.THREE) document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"><\/script>');</script>
<script>
(() => {
  'use strict';

  // ------------------------------------------------------------------
  // Canvas and sizing. The 3D view renders into #game; a transparent 2D
  // canvas (#overlay) on top carries the text.
  // ------------------------------------------------------------------
  const canvas = document.getElementById('game');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    overlay.width = Math.round(W * DPR);
    overlay.height = Math.round(H * DPR);
    octx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (renderer) {
      renderer.setPixelRatio(DPR);
      renderer.setSize(W, H, false);
    }
    layout();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // ------------------------------------------------------------------
  // World layout (recomputed on resize)
  // ------------------------------------------------------------------
  const L = {};   // layout numbers
  function layout() {
    L.S = Math.max(48, Math.min(96, W * 0.14));        // base size: acorns, branches, piles
    L.SQ = L.S * 1.4;                                   // the squirrel itself, and its hitboxes
    L.groundY0 = H - Math.max(70, H * 0.12);           // the real ground
    L.groundY = L.groundY0 - (state ? state.rise : 0);  // the surface, rising with missed acorns
    L.trunkW = Math.max(26, L.S * 0.5);
    L.trunkX = W - L.trunkW * 1.4;                     // trunk left edge
    L.pileX = L.trunkX - L.S * 0.15;                   // real pile center
    L.ghostX = L.trunkX - L.S * 1.25;                  // ghost pile center
    L.acornR = L.S * 0.22;
    L.branchW = L.S * 1.35;
    L.branchH = L.S * 0.32;
    L.canopyY = Math.max(40, H * 0.08);
    buildBackground();
  }

  // Pile radius in pixels for a count of acorns. Grows quickly at first so
  // every early catch is visible, then flattens toward a cap so a big score
  // never swallows the play area. Ghost and real piles share this curve.
  function pileRadius(n) {
    if (n <= 0) return 0;
    const rMax = Math.min(W * 0.20, H * 0.22, (H - L.groundY) * 0.3 + L.S * 1.3);
    return rMax * Math.tanh(Math.sqrt(n) / 6);
  }

  // ------------------------------------------------------------------
  // Game state
  // ------------------------------------------------------------------
  const TUNE = {
    followLag: 12,          // higher = snappier (per second easing rate)
    keySpeed: 1.6,          // screen widths per second with arrow keys
    acornSpeed: 0.28,       // screen heights per second at start
    acornInterval: 1.05,    // seconds between acorns at start
    branchInterval: 4.2,    // seconds between branches at start
    branchSpeed: 0.40,      // screen heights per second at start
    rampTime: 75,           // seconds to reach max speed
    maxMul: 2.4,            // speed multiplier at rampTime
    knockdown: 2.0,         // seconds on the back
    invuln: 1.0,            // seconds of safety after getting up
    maxPile: 9999,
    missesToFill: 220,      // missed acorns it takes to raise the ground to the canopy
    maxLives: 3,            // golden acorns refill up to three, never beyond
    goldChance: 0.03,       // chance that a spawned acorn is golden (after the tutorial)
    goldMinGap: 15,         // seconds between golden acorns at least
    goldStart: 10,          // no golden acorns in the first seconds of a run
    rottenChance: 0.07,     // chance that a spawned acorn is rotten
    rottenMinGap: 6,        // seconds between rotten acorns at least
    rottenStart: 8,         // no rotten acorns in the first seconds of a run
    slowTime: 3.0,          // seconds the squirrel is slowed after eating a rotten acorn
    slowFactor: 0.3,        // how much of its normal speed it keeps while sick
    sweepChance: 0.05,      // chance that a spawned acorn is a silver sweeper (clears half the litter)
    sweepMinGap: 18,        // seconds between sweepers at least
    sweepStart: 20,         // no sweepers in the first seconds of a run
    sweepMinLitter: 8,      // a sweeper only shows up once there is something worth sweeping
    tenChance: 0.035,       // chance that a spawned acorn is a ruby x10
    tenMinGap: 16,          // seconds between ruby acorns at least
    tenStart: 12            // no ruby acorns in the first seconds of a run
  };

  const state = {
    mode: 'ready',          // 'ready' | 'playing' | 'paused' | 'gameover'
    t: 0,
    sx: 0, targetX: 0, vx: 0, facing: 1,
    knocked: 0, invuln: 0,
    lives: 3, pile: 0, ghost: 0, ghostBuried: false,
    acorns: [], branches: [],
    acornTimer: 0, branchTimer: 0,
    keys: { left: false, right: false },
    pointerDown: false,
    tut: 0,                 // textless tutorial: 0 = first acorn pending, 1 = second pending, 2 = done
    dance: 0,               // seconds of victory dance remaining
    streak: 0,              // consecutive catches; drives the crunch pitch
    litter: [],             // missed acorns lying on the ground: {fx, up, gold, rot}
    rise: 0,                // how far the litter has lifted the ground, in px (eases toward riseTarget)
    riseTarget: 0,          // where the litter says the ground should be
    fx: [],                 // flying acorns for effects: swept litter floating off, x10 catches tossed to the pile
    labelPop: 0,            // seconds of pop left on the pile number after a x10 catch
    maxLives: 3,            // most lives held this run; sets how many hearts are shown
    lastGold: -99,          // time the last golden acorn appeared
    lastRotten: -99,        // time the last rotten acorn appeared
    lastSweep: -99,         // time the last silver sweeper appeared
    lastTen: -99,           // time the last ruby x10 appeared
    slow: 0,                // seconds of stomach ache left after a rotten acorn
    sparkle: 0,             // seconds of sparkle left after catching a golden acorn
    runPhase: 0,            // leg animation phase
    over: { t: 0, fromX: 0, shown: false, munched: false }
  };

  function speedMul() {
    const k = Math.min(1, state.t / TUNE.rampTime);
    return 1 + (TUNE.maxMul - 1) * k;
  }

  function readGhost() {
    const q = new URLSearchParams(location.search);
    const raw = parseInt(q.get('pile'), 10);
    if (!isFinite(raw) || raw <= 0) return 0;
    return Math.min(TUNE.maxPile, raw);
  }

  // Fresh run. `startNow` skips the start screen (used by the replay button).
  function reset(startNow = false) {
    state.mode = startNow ? 'playing' : 'ready';
    state.t = 0;
    state.sx = W * 0.4;
    state.targetX = state.sx;
    state.vx = 0;
    state.facing = 1;
    state.knocked = 0;
    state.invuln = 0;
    state.lives = 3;
    state.pile = 0;
    state.ghost = readGhost();
    state.ghostBuried = false;
    state.acorns.length = 0;
    state.branches.length = 0;
    state.acornTimer = 0.6;
    state.branchTimer = TUNE.branchInterval * 1.3;
    state.over.t = 0;
    state.over.shown = false;
    state.over.munched = false;
    state.tut = 0;
    state.dance = 0;
    state.streak = 0;
    state.litter.length = 0;
    state.rise = 0;
    state.riseTarget = 0;
    state.fx.length = 0;
    state.labelPop = 0;
    state.lastSweep = -99;
    state.lastTen = -99;
    L.groundY = L.groundY0;
    state.maxLives = 3;
    state.lastGold = -99;
    state.lastRotten = -99;
    state.slow = 0;
    state.sparkle = 0;
    state.runPhase = 0;
    linkbox.classList.remove('show');
    shareBtn.classList.remove('ok');
    if (startNow) SFX.music(true);
    syncUI();
  }

  function startGame() {
    if (state.mode !== 'ready' || !booted) return;   // the Start button only appears once the scene is built
    state.mode = 'playing';
    state.pointerDown = false;
    SFX.music(true);
    syncUI();
  }
  function pauseGame() {
    if (state.mode !== 'playing') return;
    state.mode = 'paused';
    state.pointerDown = false;
    state.keys.left = state.keys.right = false;
    SFX.music(false);             // the tune stops with the game
    syncUI();
  }
  function resumeGame() {
    if (state.mode !== 'paused') return;
    state.mode = 'playing';
    state.targetX = state.sx;     // no lurch toward wherever the finger landed
    SFX.music(true);
    syncUI();
  }

  // Which buttons are on screen follows the mode: the splash with its Start
  // button while ready, Resume while paused, share and replay at game over.
  function syncUI() {
    splash.classList.toggle('hide', state.mode !== 'ready');
    center.classList.toggle('show', state.mode === 'paused');
    pauseBtn.classList.toggle('show', state.mode === 'playing');
    hud.classList.toggle('show', state.mode !== 'ready');
    hud.classList.toggle('nopause', state.mode === 'gameover');
    ui.classList.toggle('show', state.mode === 'gameover' && state.over.shown);
  }

  // ------------------------------------------------------------------
  // Input
  // ------------------------------------------------------------------
  function pointerX(e) {
    const r = canvas.getBoundingClientRect();
    return e.clientX - r.left;
  }
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    SFX.unlock();   // browsers only allow audio after a gesture
    if (state.mode === 'ready') { startGame(); return; }
    if (state.mode === 'paused') { resumeGame(); return; }
    if (state.mode === 'gameover') {
      if (state.over.shown) reset(true);
      return;
    }
    state.pointerDown = true;
    state.targetX = pointerX(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener('pointermove', e => {
    if (!state.pointerDown || state.mode !== 'playing') return;
    e.preventDefault();
    state.targetX = pointerX(e);
  });
  const release = e => { state.pointerDown = false; };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('lostpointercapture', release);

  window.addEventListener('keydown', e => {
    SFX.unlock();
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.keys.right = true;
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      if (state.mode === 'playing') pauseGame();
      else if (state.mode === 'paused') resumeGame();
      e.preventDefault();
      return;
    }
    if (e.key === ' ') {
      // Space is the one-key remote: start, pause, resume, play again.
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      if (state.mode === 'ready') startGame();
      else if (state.mode === 'playing') pauseGame();
      else if (state.mode === 'paused') resumeGame();
      else if (state.mode === 'gameover' && state.over.shown) reset(true);
      e.preventDefault();
      return;
    }
    if (e.key === 'Enter') {
      if (state.mode === 'ready') startGame();
      else if (state.mode === 'paused') resumeGame();
      else if (state.mode === 'gameover' && state.over.shown) reset(true);
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.keys.right = false;
  });

  // ------------------------------------------------------------------
  // Share UI
  // ------------------------------------------------------------------
  const ui = document.getElementById('ui');
  const center = document.getElementById('center');
  const splash = document.getElementById('splash');
  const startBtn = document.getElementById('startBtn');
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  for (const b of [startBtn, playBtn, pauseBtn]) b.addEventListener('pointerdown', e => e.stopPropagation());
  startBtn.addEventListener('click', e => { e.stopPropagation(); SFX.unlock(); startGame(); });
  playBtn.addEventListener('click', e => { e.stopPropagation(); SFX.unlock(); resumeGame(); });
  pauseBtn.addEventListener('click', e => { e.stopPropagation(); pauseGame(); });
  // A focused button would swallow the next Space press, so buttons let go of focus after a click.
  for (const b of document.querySelectorAll('button')) b.addEventListener('click', () => b.blur());

  // Lives display. DOM is only touched when the number changes.
  const hud = document.getElementById('hud');
  const hearts = Array.from(document.querySelectorAll('#heartsStat .h'));
  let hudLives = -1;
  function updateHud() {
    if (hudLives !== state.lives) {
      // Filled hearts = lives remaining, hollow grey hearts = lives used.
      // Hearts empty from the right so the remaining ones stay in place.
      const losing = hudLives > state.lives;
      const gaining = hudLives >= 0 && hudLives < state.lives;
      hudLives = state.lives;
      hearts.forEach((h, i) => {
        const alive = i < state.lives;
        h.textContent = alive ? '♥' : '♡';
        h.classList.toggle('lost', !alive);
        h.classList.remove('pop', 'gain');
        if (losing && i === state.lives) { void h.offsetWidth; h.classList.add('pop'); }
        if (gaining && i === state.lives - 1) { void h.offsetWidth; h.classList.add('gain'); }
      });
    }
  }
  const shareBtn = document.getElementById('shareBtn');
  const replayBtn = document.getElementById('replayBtn');
  const linkbox = document.getElementById('linkbox');
  const linkInput = document.getElementById('linkInput');

  function shareURL() {
    return `${location.origin}${location.pathname}?pile=${Math.min(TUNE.maxPile, state.pile)}`;
  }
  async function share() {
    const url = shareURL();
    let ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(url);
        ok = true;
      }
    } catch (_) { ok = false; }
    if (ok) {
      shareBtn.classList.add('ok');
      shareBtn.textContent = '✅';
      setTimeout(() => { shareBtn.textContent = '🔗'; shareBtn.classList.remove('ok'); }, 1400);
    } else {
      linkInput.value = url;
      linkbox.classList.add('show');
      linkInput.focus();
      linkInput.select();
    }
  }
  shareBtn.addEventListener('pointerdown', e => e.stopPropagation());
  replayBtn.addEventListener('pointerdown', e => e.stopPropagation());
  shareBtn.addEventListener('click', e => { e.stopPropagation(); share(); });
  replayBtn.addEventListener('click', e => { e.stopPropagation(); SFX.unlock(); reset(true); });

  // ------------------------------------------------------------------
  // Sound: everything is synthesised with Web Audio, no files needed.
  // SFX.play(name) is the only entry point so Day 3 sounds slot in here.
  // ------------------------------------------------------------------
  const SFX = (() => {
    let ac = null, master = null, noiseBuf = null;

    function unlock() {
      if (!ac) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ac = new AC();
          master = ac.createGain();
          master.gain.value = 0.8;
          master.connect(ac.destination);
        } catch (_) { ac = null; return; }
      }
      if (ac.state === 'suspended') ac.resume().catch(() => {});
      applyMute();
      startWind();
      startMusic();
    }

    // Mute covers everything: music, wind and effects. Remembered between visits.
    let muted = false;
    try { muted = localStorage.getItem('hs-muted') === '1'; } catch (_) {}
    function applyMute() {
      if (master) master.gain.setTargetAtTime(muted ? 0 : 0.8, ac.currentTime, 0.03);
    }
    function toggleMute() {
      muted = !muted;
      try { localStorage.setItem('hs-muted', muted ? '1' : '0'); } catch (_) {}
      applyMute();
      return muted;
    }

    // Background music: an eight-bar loop in C pentatonic, scheduled a little
    // ahead of time so it never stutters. Bass on the bar, a soft arpeggio on
    // the eighths, and a simple melody on top. Runs as long as the page lives.
    const MUSIC = {
      bpm: 96,
      bass:   [36, 33, 29, 31],                       // C2 A1 F1 G1, two bars each
      chords: [[60, 67, 64], [57, 64, 60], [53, 60, 57], [55, 62, 59]],
      arp:    [0, 1, 2, 1, 0, 2, 1, 2],               // chord-tone index per eighth
      melody: [76, 79, 81, 79,  76, 74, 72, 0,
               69, 72, 74, 76,  74, 72, 69, 0,
               69, 72, 76, 74,  72, 69, 67, 0,
               67, 74, 76, 74,  76, 74, 67, 0]
    };
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    let music = null, musicOn = true;

    function pluck(midi, t, vol, dur, dest) {
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(midi);
      const o2 = ac.createOscillator(); o2.type = 'triangle'; o2.frequency.value = mtof(midi);
      const g = ac.createGain(), g2 = ac.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.008); g2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.6);
      o.connect(g); g.connect(dest); o2.connect(g2); g2.connect(dest);
      o.start(t); o.stop(t + dur + 0.05); o2.start(t); o2.stop(t + dur + 0.05);
    }
    function bassNote(midi, t, dur, dest) {
      const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(midi);
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(f); f.connect(g); g.connect(dest);
      o.start(t); o.stop(t + dur + 0.05);
    }
    function startMusic() {
      if (music || !ac) return;
      const bus = ac.createGain();
      bus.gain.value = 0.28;
      bus.connect(master);
      music = { bus, beat: 0, next: ac.currentTime + 0.15, spb: 60 / MUSIC.bpm, timer: setInterval(scheduleMusic, 60) };
    }
    // Pause fades the tune out and stops scheduling; resume fades it back in
    // from the next beat rather than replaying everything it missed.
    function setMusic(on) {
      musicOn = on;
      if (!music) return;
      music.bus.gain.setTargetAtTime(on ? 0.28 : 0, ac.currentTime, 0.06);
      if (on) music.next = Math.max(music.next, ac.currentTime + 0.12);
    }
    function scheduleMusic() {
      if (!music || !musicOn || ac.state !== 'running') return;
      const spb = music.spb;
      while (music.next < ac.currentTime + 0.45) {
        const t = music.next;
        const b = music.beat % 32, bar = Math.floor(b / 4), ci = Math.floor(bar / 2);
        const chord = MUSIC.chords[ci];
        if (b % 4 === 0) bassNote(MUSIC.bass[ci], t, spb * 3.6, music.bus);
        const e = (b % 4) * 2;
        pluck(chord[MUSIC.arp[e]] + 12, t, 0.09, spb * 0.9, music.bus);
        pluck(chord[MUSIC.arp[e + 1]] + 12, t + spb / 2, 0.07, spb * 0.8, music.bus);
        const m = MUSIC.melody[b];
        if (m) pluck(m, t, 0.17, spb * 1.6, music.bus);
        music.next += spb;
        music.beat += 1;
      }
    }

    // Wind: a looping band of noise whose level follows the speed ramp.
    // It is the ambience, the difficulty meter, and the reason things fall.
    let wind = null, windLevel = 0, windT = 0;
    function startWind() {
      if (wind || !ac) return;
      try {
        const src = ac.createBufferSource();
        src.buffer = noise(); src.loop = true;
        const f = ac.createBiquadFilter();
        f.type = 'bandpass'; f.frequency.value = 380; f.Q.value = 0.6;
        const g = ac.createGain();
        g.gain.value = 0;
        src.connect(f); f.connect(g); g.connect(master);
        src.start();
        wind = { src, f, g };
      } catch (_) { wind = null; }
    }
    // level 0..1, called every frame; eases so changes never click.
    function setWind(level, dt) {
      if (!wind || ac.state !== 'running') return;
      windT += dt;
      windLevel += (level - windLevel) * Math.min(1, dt * 1.5);
      const sway = 0.75 + 0.25 * Math.sin(windT * 0.9) * Math.sin(windT * 0.37 + 1);
      const target = windLevel <= 0.001 ? 0.0001 : (0.025 + windLevel * 0.17) * sway;
      wind.g.gain.setTargetAtTime(target, ac.currentTime, 0.08);
      wind.f.frequency.setTargetAtTime(320 + windLevel * 520, ac.currentTime, 0.2);
    }

    function noise() {
      if (noiseBuf) return noiseBuf;
      const len = ac.sampleRate;
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return noiseBuf;
    }

    // A filtered noise burst with a fast attack and exponential decay.
    function burst({ type = 'bandpass', freq = 1000, q = 1, vol = 0.5, dur = 0.08, delay = 0 }) {
      const t = ac.currentTime + delay;
      const src = ac.createBufferSource();
      src.buffer = noise();
      const f = ac.createBiquadFilter();
      f.type = type; f.frequency.value = freq; f.Q.value = q;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t); src.stop(t + dur + 0.05);
    }

    // A tone that glides through a list of [timeOffset, frequency] points.
    function tone({ type = 'sine', points, vol = 0.4, dur, delay = 0, attack = 0.01 }) {
      const t = ac.currentTime + delay;
      const o = ac.createOscillator();
      o.type = type;
      o.frequency.setValueAtTime(points[0][1], t);
      for (let i = 1; i < points.length; i++) o.frequency.exponentialRampToValueAtTime(points[i][1], t + points[i][0]);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur + 0.05);
    }

    const lib = {
      // Tiny dry crunch. `pitch` is a multiplier so Day 3 can climb a scale.
      crunch(pitch = 1) {
        burst({ freq: 1600 * pitch, q: 0.9, vol: 0.55, dur: 0.07 });
        burst({ freq: 3800 * pitch, q: 1.2, vol: 0.25, dur: 0.045, delay: 0.012 });
      },
      // Branch lands on the squirrel.
      thud() {
        tone({ type: 'sine', points: [[0, 120], [0.18, 38]], vol: 0.9, dur: 0.24, attack: 0.004 });
        burst({ type: 'lowpass', freq: 320, q: 0.7, vol: 0.6, dur: 0.14 });
      },
      // The squirrel's reaction, more pathetic with every life lost:
      // 1 = surprised eek, 2 = longer whine, 3 = sad deflating squeak.
      squeak(level = 1) {
        if (level >= 3) {
          tone({ type: 'triangle', points: [[0, 1000], [0.15, 1100], [0.5, 520], [0.9, 330]], vol: 0.3, dur: 0.95, delay: 0.15, attack: 0.03 });
        } else if (level === 2) {
          tone({ type: 'triangle', points: [[0, 1200], [0.12, 880], [0.26, 1080], [0.5, 680]], vol: 0.3, dur: 0.52, delay: 0.12, attack: 0.02 });
        } else {
          tone({ type: 'triangle', points: [[0, 1050], [0.07, 1750], [0.2, 820]], vol: 0.32, dur: 0.22, delay: 0.12 });
        }
      },
      // A gust: swells just before a branch's shadow appears.
      gust() {
        const t = ac.currentTime;
        const src = ac.createBufferSource();
        src.buffer = noise();
        const f = ac.createBiquadFilter();
        f.type = 'bandpass'; f.Q.value = 0.8;
        f.frequency.setValueAtTime(300, t);
        f.frequency.exponentialRampToValueAtTime(950, t + 0.3);
        f.frequency.exponentialRampToValueAtTime(420, t + 0.75);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);

  // Mute button: top-right, shown in every mode.

  // ------------------------------------------------------------------
  // Spawning
  // ------------------------------------------------------------------
  function spawnAcorn() {
    const m = L.acornR * 2;
    let x = m + Math.random() * (L.trunkX - m * 2);
    // Textless tutorial: the first acorn lands on the squirrel for free,
    // the second falls one thumb-width to the side so the player drags by reflex.
    if (state.tut === 0) {
      x = state.sx;
      state.tut = 1;
    } else if (state.tut === 1) {
      const side = state.sx > W * 0.5 ? -1 : 1;
      x = Math.max(m, Math.min(L.trunkX - m, state.sx + side * L.S * 1.1));
      state.tut = 2;
    }
    // A rare golden acorn restores a life. Never during the tutorial, never
    // too early, never two close together, and never when already at the cap.
    const gold = state.tut === 2
      && state.t > TUNE.goldStart
      && state.t - state.lastGold > TUNE.goldMinGap
      && state.lives < TUNE.maxLives
      && Math.random() < TUNE.goldChance;
    if (gold) state.lastGold = state.t;
    // A rotten acorn looks almost right but gives the squirrel a stomach ache.
    const rotten = !gold && state.tut === 2
      && state.t > TUNE.rottenStart
      && state.t - state.lastRotten > TUNE.rottenMinGap
      && Math.random() < TUNE.rottenChance;
    if (rotten) state.lastRotten = state.t;
    // A silver sweeper clears half the litter and lets the ground back down.
    const sweep = !gold && !rotten && state.tut === 2
      && state.t > TUNE.sweepStart
      && state.t - state.lastSweep > TUNE.sweepMinGap
      && state.litter.length >= TUNE.sweepMinLitter
      && Math.random() < TUNE.sweepChance;
    if (sweep) state.lastSweep = state.t;
    // A ruby acorn is worth ten.
    const ten = !gold && !rotten && !sweep && state.tut === 2
      && state.t > TUNE.tenStart
      && state.t - state.lastTen > TUNE.tenMinGap
      && Math.random() < TUNE.tenChance;
    if (ten) state.lastTen = state.t;
    const special = gold || sweep || ten;
    state.acorns.push({
      x,
      y: -L.acornR * 2,
      vy: TUNE.acornSpeed * H * speedMul() * (special ? 0.78 : 0.9 + Math.random() * 0.25),
      rot: Math.random() * Math.PI * 2,
      spin: special ? 0.6 : (Math.random() - 0.5) * 3,
      gold,
      rotten,
      sweep,
      ten,
      baseX: x,
      wob: Math.random() * Math.PI * 2   // golden acorns drift side to side

  }
  function spawnBranch() {
    const half = L.branchW / 2;
    const landX = half + Math.random() * (L.trunkX - half * 2);
    const vy = TUNE.branchSpeed * H * speedMul();
    // Start high enough that the shadow gives a fair lead time.
    const startY = -(vy * 1.6);
    state.branches.push({ x: landX, y: startY, vy, startY });
    SFX.play('gust');   // gust first, then look up
  }

  // ------------------------------------------------------------------
  // Update
  // ------------------------------------------------------------------
  function squirrelBox() {
    const w = L.SQ * 0.62, h = L.SQ * 0.78;
    return { x: state.sx - w / 2, y: L.groundY - h, w, h };
  }
  // Branches only count when they hit the body itself, not the fluffy edges:
  // the bigger squirrel is no easier to knock down than the old one.
  function hurtBox() {
    const w = L.S * 0.62, h = L.SQ * 0.78;

  function overlaps(a, b) {

  function update(dt) {
    // Wind follows the speed ramp while playing and dies away at game over.
    SFX.wind(state.mode === 'playing' ? (speedMul() - 1) / (TUNE.maxMul - 1) : 0, dt);

    // The background keeps breathing except while paused.
    if (state.mode !== 'paused') updateBackground(dt);

    // Start screen and pause: the world holds still.
    if (state.mode === 'ready' || state.mode === 'paused') return;

    if (state.mode === 'gameover') {

      // Walk to the pile and sit down on it.
      const target = L.pileX;
      const k = Math.min(1, state.over.t / 1.1);
      const ease = 1 - Math.pow(1 - k, 3);
      state.sx = state.over.fromX + (target - state.over.fromX) * ease;
      state.facing = target > state.over.fromX ? 1 : -1;

      for (const b of state.branches) b.y += b.vy * dt;
      state.acorns = state.acorns.filter(a => a.y < L.groundY + L.acornR * 3);

    state.t += dt;
    const mul = speedMul();

    // A rotten acorn leaves the squirrel sluggish for a few seconds.
    if (state.slow > 0) state.slow -= dt;
    const slowK = state.slow > 0 ? TUNE.slowFactor : 1;

    // Keyboard steering moves the target.
    if (state.keys.left !== state.keys.right) {
      const dir = state.keys.left ? -1 : 1;
      state.targetX += dir * TUNE.keySpeed * slowK * W * dt;

    const half = L.S * 0.35;   // same running room as before; the bigger body may brush the trunk

    // Follow lag: ease toward the target, frame-rate independent.
    if (state.knocked <= 0) {
      const prev = state.sx;
      const alpha = 1 - Math.exp(-TUNE.followLag * slowK * dt);
      state.sx += (state.targetX - state.sx) * alpha;
      state.vx = (state.sx - prev) / Math.max(dt, 1e-4);
      if (Math.abs(state.vx) > 12) state.facing = state.vx > 0 ? 1 : -1;
      state.runPhase += Math.min(Math.abs(state.vx), L.S * 8) / L.S * dt * 2.2;
    } else {
      state.knocked -= dt;
      if (state.knocked <= 0) {
        state.knocked = 0;
        state.invuln = TUNE.invuln;
        state.targetX = state.sx; // don't lurch after getting up
      }

    if (state.invuln > 0) state.invuln -= dt;
    if (state.dance > 0) state.dance -= dt;
    if (state.sparkle > 0) state.sparkle -= dt;
    if (state.labelPop > 0) state.labelPop -= dt;
    updateFx(dt);

    // Timers
    state.acornTimer -= dt;

      spawnAcorn();
      state.acornTimer = (TUNE.acornInterval / mul) * (0.75 + Math.random() * 0.5);
    }
    state.branchTimer -= dt;
    if (state.branchTimer <= 0) {

    const catchBox = state.knocked > 0 ? null : {

    const bellyBox = state.knocked > 0 ? {
      x: state.sx - L.SQ * 0.48, y: L.groundY - L.SQ * 0.46, w: L.SQ * 0.96, h: L.SQ * 0.46

      if (a.bounced) {
        a.vy += H * 1.1 * dt;          // only bounced acorns feel gravity

      } else if (a.gold || a.sweep || a.ten) {

      a.rot += a.spin * dt;
      const ar = (a.gold || a.sweep || a.ten) ? L.acornR * 1.3 : L.acornR;   // special ones are bigger and a touch more forgiving
      const ab = { x: a.x - ar, y: a.y - ar, w: ar * 2, h: ar * 2 };
      if (!a.bounced && catchBox && overlaps(ab, catchBox)) {

        if (a.rotten) {

          state.slow = TUNE.slowTime;
          state.streak = 0;
          SFX.play('blegh');
          continue;
        }
        state.pile = Math.min(TUNE.maxPile, state.pile + 1);
        state.streak += 1;
        if (a.gold) {
          state.lives = Math.min(TUNE.maxLives, state.lives + 1);
          state.maxLives = Math.max(state.maxLives, state.lives);
          state.sparkle = 0.8;
          SFX.play('chime');

        if (a.sweep) sweepLitter();
        if (a.ten) tossTen();
        // Each catch in a row climbs a semitone; a miss resets the scale.
        SFX.play('crunch', Math.pow(2, Math.min(state.streak - 1, 14) / 12));
        if (state.ghost > 0 && !state.ghostBuried && state.pile > state.ghost) {

        }

      }
      if (!a.bounced && bellyBox && a.vy > 0 && overlaps(ab, bellyBox)) {
        a.bounced = true;
        a.vy = -Math.abs(a.vy) * 0.5;
        a.vx = (a.x < state.sx ? -1 : 1) * L.S * (1.2 + Math.random() * 1.2);
        a.spin = (Math.random() - 0.5) * 12;
        continue;
      }
      if (a.x < -L.S || a.x > W + L.S) {
        state.acorns.splice(i, 1);
        if (!a.rotten) missAcorn(a);
        continue;
      }
      if (a.y > L.groundY - L.acornR * 0.4) {
        if (a.rotten) { state.acorns.splice(i, 1); continue; }   // squish, gone, no harm done
        const hops = a.hops || 0;

          if (hops === 0) state.streak = 0;                        // the miss happened here
          a.y = L.groundY - L.acornR * 0.4;
          a.vy = -a.vy * 0.55;
          a.vx = (a.vx || 0) * 0.5 + (Math.random() - 0.5) * L.S * 1.4;
          a.spin = (Math.random() - 0.5) * 10;

          a.hops = hops + 1;

    }
  }

  // A missed acorn lies where it fell. Positions are stored as fractions so a
  // resize keeps the litter in place.
  function missAcorn(a) {
    const x = Math.max(L.acornR, Math.min(W - L.acornR, a.x));
    state.litter.push({ fx: x / W, up: L.groundY0 - L.groundY + L.acornR * 0.15, gold: !!a.gold, rot: (Math.random() - 0.5) * 1.2 });
  }

  // The litter lifts the ground. When the squirrel would touch the canopy, it's buried.
  function groundLimit() { return L.canopyY + BG.r * 0.65 + L.SQ * 1.05; }
  function settleGround(dt) {
    const maxRise = Math.max(0, L.groundY0 - groundLimit());
    state.riseTarget = Math.min(maxRise, state.litter.length * (maxRise / TUNE.missesToFill));
    // The surface eases toward where the litter puts it, so a sweep sinks it smoothly.
    const d = state.riseTarget - state.rise;
    state.rise = Math.abs(d) < 0.05 ? state.riseTarget : state.rise + d * Math.min(1, dt * 6);
    L.groundY = L.groundY0 - state.rise;
    if (state.mode === 'playing' && state.riseTarget >= maxRise - 0.01) buried();
  }

  // Silver sweeper caught: every other acorn in the litter floats away, so

  function sweepLitter() {

    const keep = [], gone = [];
    for (let i = 0; i < n; i++) ((n === 1 || i % 2) ? gone : keep).push(state.litter[i]);
    state.litter.length = 0;
    for (const lt of keep) state.litter.push(lt);
    for (let i = 0; i < gone.length; i++) {
      const lt = gone[i];
      state.fx.push({
        kind: 'poof', gold: lt.gold,
        x: lt.fx * W, y: L.groundY - L.acornR * 0.8,
        vx: (Math.random() - 0.5) * L.S * 2.2, vy: -(L.S * 3.5 + Math.random() * L.S * 4),
        rot: lt.rot, spin: (Math.random() - 0.5) * 14,
        t: -Math.min(0.5, i * 0.012), life: 0.9 + Math.random() * 0.5
      });
    }

    SFX.play('sweep');
  }

  // Ruby acorn caught: ten more on the pile, tossed over one after another.
  function tossTen() {
    state.pile = Math.min(TUNE.maxPile, state.pile + 10);
    state.streak += 10;
    state.sparkle = 0.8;
    SFX.play('jackpot');
    for (let i = 0; i < 10; i++) {
      state.fx.push({
        kind: 'toss', gold: false,
        x: state.sx, y: L.groundY - L.SQ * 0.7,
        tx: L.pileX + (Math.random() - 0.5) * L.S * 0.6, ty: L.groundY - pileRadius(state.pile) * 0.9,
        arc: L.S * (2.2 + Math.random() * 1.2),
        rot: Math.random() * 6, spin: (Math.random() - 0.5) * 10,
        t: -i * 0.07, life: 0.55
      });
    }
  }

  // Effect acorns: swept litter floats up and shrinks away; tossed ones arc to the pile.
  function updateFx(dt) {
    for (let i = state.fx.length - 1; i >= 0; i--) {
      const f = state.fx[i];
      f.t += dt;
      if (f.t < 0) continue;
      f.rot += f.spin * dt;
      if (f.kind === 'poof') {
        f.vy += H * 0.35 * dt;      // a light pull so they drift rather than shoot
        f.x += f.vx * dt;
        f.y += f.vy * dt;

      if (f.t >= f.life) {

      }

  }
  function buried() {
    state.mode = 'gameover';
    state.over.t = 0;
    state.over.fromX = state.sx;
    state.knocked = 0;
    state.dance = 0;
    SFX.play('squeak', 3);
  }

  function hit() {
    state.lives -= 1;
    state.dance = 0;
    state.streak = 0;
    SFX.play('thud');
    SFX.play('squeak', 3 - Math.max(0, state.lives));
    if (state.lives <= 0) {
      state.lives = 0;
      state.mode = 'gameover';
      state.over.t = 0;
      state.over.fromX = state.sx;
      state.knocked = 0;
      return;
    }
    state.knocked = TUNE.knockdown;
  }

  // ------------------------------------------------------------------
  // Drawing: a Three.js scene. All the game logic above still thinks in

        BELLY = '#f7d9b0', INK = '#3b2314', PINK = '#f2a68e';

  const Y = py => L.groundY0 - py;       // screen y -> world y (up), real ground at 0
  const hash = k => { const x = Math.sin(k * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };

  const FOV = 38;
  let renderer = null, scene = null, camera = null, sun = null, hemi = null;

  // A group whose local coordinates are play-plane pixels, pushed back to

  function depthGroup(z) {

  // Small builders so the characters read like the 2D art: balls and rods.
  function std(color, o) { return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.9, metalness: 0 }, o || {})); }
  function ball(parent, material, x, y, z, rx, ry = rx, rz = rx, geo = GEO.sphere) {
    const m = new THREE.Mesh(geo, material);
    m.position.set(x, y, z);

  }
  const _up = new THREE.Vector3(0, 1, 0), _dir = new THREE.Vector3();
  function setRod(m, ax, ay, az, bx, by, bz, r) {
