  function initScene() {
    try {
      if (!window.THREE) throw new Error('no three');
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
    } catch (e) { renderer = null; }
    if (!renderer) {
      document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:600 20px system-ui;color:#3b2314;background:#eaf7ff">This game needs WebGL.</div>');
      return;
    }
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    scene = new THREE.Scene();
    scene.fog = new THREE.Fog(new THREE.Color(C['sky-bottom']), 1000, 4000);
    camera = new THREE.PerspectiveCamera(FOV, 1, 10, 12000);
    // Soft sky light from above plus a warm sun from the front-left that casts the shadows.
    hemi = new THREE.HemisphereLight(0xe2f2ff, 0x6b9a46, 1.4);
    sun = new THREE.DirectionalLight(0xfff0d2, 2.4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 3;
    scene.add(hemi, sun, sun.target);
    makeAssets();
    buildStatic();
  }

  function buildStatic() {
    // Sky: a far gradient plane, top colour to bottom colour.
    const skyGeo = new THREE.PlaneGeometry(1, 1);
    const top = new THREE.Color(C['sky-top']), bot = new THREE.Color(C['sky-bottom']);
    skyGeo.setAttribute('color', new THREE.Float32BufferAttribute([top.r, top.g, top.b, top.r, top.g, top.b, bot.r, bot.g, bot.b, bot.r, bot.g, bot.b], 3));
    R3.sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, fog: false }));
    scene.add(R3.sky);
    // Ground: a big grassy plane running off to the horizon.
    R3.ground = new THREE.Mesh(GEO.plane, MAT.grass);
    R3.ground.rotation.x = -Math.PI / 2;
    R3.ground.receiveShadow = true;
    scene.add(R3.ground);
    // Soft hills on the horizon, so the ground has somewhere to go.
    R3.hills = new THREE.Group();
    scene.add(R3.hills);
    for (let i = 0; i < 7; i++) {
      const m = ball(R3.hills, i % 2 ? MAT.hillFar : MAT.hillNear, 0, 0, 0, 1);
      m.castShadow = false;
      m.userData.i = i;
    }
    // The litter of missed acorns: a slab that lifts the ground, with the newest acorns lying on top.
    R3.slab = new THREE.Mesh(GEO.box, [MAT.heapSide, MAT.heapSide, MAT.heapTop, MAT.heapSide, MAT.heapFront, MAT.heapSide]);
    R3.slab.position.set(0, 0, -75);   // a strip around the play line, not the whole foreground
    R3.slab.castShadow = true;
    R3.slab.receiveShadow = true;
    R3.slab.visible = false;
    scene.add(R3.slab);
    const LIT = 400;
    R3.litter = { body: new THREE.InstancedMesh(GEO.acornBody, MAT.litter, LIT), cap: new THREE.InstancedMesh(GEO.acornCap, MAT.litterCap, LIT), capacity: LIT, lastKey: '' };
    for (const m of [R3.litter.body, R3.litter.cap]) {
      m.castShadow = true; m.receiveShadow = true; m.count = 0; m.frustumCulled = false;
      scene.add(m);
    }
    // Effect acorns (swept litter, x10 tosses) share the litter look.
    const FXN = 160;
    R3.fx = { body: new THREE.InstancedMesh(GEO.acornBody, MAT.litter, FXN), cap: new THREE.InstancedMesh(GEO.acornCap, MAT.litterCap, FXN), capacity: FXN };
    for (const m of [R3.fx.body, R3.fx.cap]) {
      m.castShadow = false; m.count = 0; m.frustumCulled = false;
      scene.add(m);
    }
    // Layers, from the clouds at the back to the play plane at the front.
    R3.cloudG = depthGroup(-1500);
    R3.treeG = depthGroup(-130);
    R3.pileG = depthGroup(-50);
    R3.playG = depthGroup(0);
    R3.pile = makePile();
    R3.ghostPile = makePile();
    R3.pileG.add(R3.pile.g, R3.ghostPile.g);
    R3.sparkle = makeSparkle();
    R3.playG.add(R3.sparkle.g);
  }

  // Camera, lights and the big static pieces follow the screen size.
  function layoutScene() {
    camera.aspect = W / H;
    camD = (H / 2) / Math.tan(FOV / 2 * Math.PI / 180);   // the play plane fills the view exactly
    camY = L.groundY0 - H / 2;                               // world y at the centre of the screen
    camera.position.set(0, camY, camD);
    camera.lookAt(0, camY, 0);
    camera.updateProjectionMatrix();
    for (const g of R3.groups) placeDepth(g);
    sun.position.set(-W * 0.55, H * 1.5, 1300);
    sun.target.position.set(0, H * 0.25, -150);
    const sc = sun.shadow.camera, ext = Math.max(W, H) * 1.15;
    sc.left = -ext; sc.right = ext; sc.top = ext; sc.bottom = -ext; sc.near = 50; sc.far = 6000;
    sc.updateProjectionMatrix();
    scene.fog.near = camD + 700;
    scene.fog.far = camD + 3400;
    const kS = (camD + 4000) / camD;
    const skyMid = (L.groundY0 - H * 0.25) / 2;
    R3.sky.position.set(0, camY + (Y(skyMid) - camY) * kS, -4000);
    R3.sky.scale.set(W * 1.8 * kS, (L.groundY0 + H * 0.25) * kS, 1);
    for (const m of R3.hills.children) {
      const i = m.userData.i, far = i % 2 === 1;
      const z = far ? -2900 : -2500, span = W * 7;
      m.position.set(-span / 2 + (i + 0.5) * span / 7 + (hash(i + 9) - 0.5) * W, -120, z);
      m.scale.set(W * (1.1 + hash(i) * 0.6), H * (0.55 + hash(i + 3) * 0.45), 500);
    }
    R3.ground.scale.set(W * 8, 3800, 1);
    R3.ground.position.set(0, 0, -1300);
    TEX.grass.repeat.set(W * 8 / 170, 3800 / 170);
    TEX.heap.repeat.set(W * 3 / 150, 2);
    TEX.heapFront.repeat.set(W * 3 / 150, 2);
    TEX.heapSide.repeat.set(2, 2);
    // The squirrel and anything falling are sized from S, so they are rebuilt.
    if (R3.sq) R3.playG.remove(R3.sq.g);
    R3.sq = buildSquirrel(L.SQ);
    R3.playG.add(R3.sq.g);
    for (const [, m] of R3.acorns) { R3.playG.remove(m.g); if (m.blob) R3.playG.remove(m.blob); }
    R3.acorns.clear();
    for (const [, m] of R3.branches) { R3.playG.remove(m.g); R3.playG.remove(m.blob); }
    R3.branches.clear();
    R3.pile.lastKey = R3.ghostPile.lastKey = R3.litter.lastKey = '';
  }

  // ------------------------------------------------------------------
  // Living background: clouds, a tree with branches, swaying leaf clusters,
  // acorns hanging in the canopy, and the odd leaf drifting down.
  // Purely decorative; nothing here can be caught or hit.
  // ------------------------------------------------------------------
  const BG = { clouds: [], clusters: [], hang: [], leaves: [], limbs: [], r: 60, leafTimer: 0 };
  let bgT = 0;

  function buildBackground() {
    const r = Math.max(50, Math.min(W * 0.16, H * 0.14));
    BG.r = r;
    BG.clusters = [];
    for (let x = -r * 0.2, i = 0; x < W + r; x += r * 0.9, i++) {
      BG.clusters.push({ x, y: L.canopyY - r * 0.35, r, phase: i * 1.7, dark: true });
    }
    for (let x = r * 0.25, i = 0; x < W + r; x += r * 0.9, i++) {
      BG.clusters.push({ x, y: L.canopyY - r * 0.6, r: r * 0.9, phase: i * 2.3 + 1, dark: false });
    }
    // Limbs reach out from the trunk just below the canopy, each with a tuft
    // of leaves at the tip, so the branches are visible and visibly swaying.
    BG.limbs = [
      { y: L.canopyY + r * 0.95, len: W * 0.40, lift: r * 0.45, w: L.trunkW * 0.42, tuft: r * 0.42, phase: 0.0 },
      { y: L.canopyY + r * 1.35, len: W * 0.26, lift: r * 0.30, w: L.trunkW * 0.32, tuft: r * 0.34, phase: 2.1 },
      { y: L.canopyY + r * 1.75, len: W * 0.15, lift: r * 0.18, w: L.trunkW * 0.26, tuft: r * 0.26, phase: 4.2 }
    ];
    BG.hang = [];
    const n = Math.max(4, Math.round(W / 120));
    for (let i = 0; i < n; i++) {
      BG.hang.push({ x: (i + 0.5 + Math.random() * 0.4) * (L.trunkX / n), y: L.canopyY + r * (0.45 + Math.random() * 0.25), phase: Math.random() * 6.28 });
    }
    BG.clouds = [];
    for (let i = 0; i < 3; i++) {
      BG.clouds.push({ x: Math.random() * W, y: L.canopyY + r * 0.8 + (L.groundY0 - L.canopyY) * (0.08 + i * 0.16), s: L.S * (0.55 + Math.random() * 0.4), v: 6 + Math.random() * 8 });
    }
    BG.leaves = [];
    if (renderer) { layoutScene(); buildTree(); }
  }

  function updateBackground(dt) {
    bgT += dt;
    const windy = Math.max(0, Math.min(1, state.mode === 'playing' ? (speedMul() - 1) / (TUNE.maxMul - 1) : 0));
    for (const c of BG.clouds) {
      c.x += c.v * (1 + windy * 2) * dt;
      if (c.x - c.s * 2 > W) c.x = -c.s * 2;
    }
    BG.leafTimer -= dt;
    if (BG.leafTimer <= 0 && BG.leaves.length < 6) {
      BG.leaves.push({
        x: Math.random() * L.trunkX, y: L.canopyY + BG.r * 0.6,
        vy: H * (0.05 + Math.random() * 0.04), phase: Math.random() * 6.28, rot: Math.random() * 6.28,
        size: L.acornR * (0.6 + Math.random() * 0.5)
      });
      BG.leafTimer = 1.6 + Math.random() * 2.4 - windy * 1.2;
    }
    for (let i = BG.leaves.length - 1; i >= 0; i--) {
      const lf = BG.leaves[i];
      lf.phase += dt * 2.2;
      lf.y += lf.vy * (1 + windy * 0.6) * dt;
      lf.x += (Math.sin(lf.phase) * 28 + windy * 30) * dt;
      lf.rot += dt * 1.5;
      if (lf.y > L.groundY + 4) BG.leaves.splice(i, 1);
    }
  }

  // The tree, the clouds and the crowd are built once per layout from the BG numbers.
  function buildTree() {
    const T = R3.treeG;
    T.clear();
    R3.limbs = []; R3.clusters = []; R3.hang = []; R3.leaves = []; R3.peekers = [];
    const r = BG.r, tw = L.trunkW, tx = X(L.trunkX + tw * 0.5);
    // Trunk: a lathe with a flared base, reaching up into the leaves.
    const h = Y(L.canopyY) + r * 0.4;
    const prof = [[0, -80], [tw * 0.85, -80], [tw * 0.66, 20], [tw * 0.52, h * 0.35], [tw * 0.47, h * 0.75], [tw * 0.42, h], [0, h]]
      .map(p => new THREE.Vector2(p[0], p[1]));
    const trunk = new THREE.Mesh(new THREE.LatheGeometry(prof, 18), MAT.bark);
    trunk.position.set(tx, 0, 0);
    trunk.castShadow = true;
    trunk.receiveShadow = true;
    T.add(trunk);
    // Limbs sway from a pivot on the trunk, with a leafy tuft at the tip and a twig halfway.
    for (const lb of BG.limbs) {
      const g = new THREE.Group();
      g.position.set(tx, Y(lb.y), 0);
      T.add(g);
      const tipX = -lb.len, tipY = lb.lift;
      rod(g, MAT.bark, 0, 0, 0, tipX, tipY, 0, lb.w * 0.5, GEO.taper);
      const midX = -lb.len * 0.55, midY = lb.lift * 0.45;
      rod(g, MAT.bark, midX, midY, 0, midX - lb.len * 0.07, midY + lb.tuft * 0.9, 0, lb.w * 0.22, GEO.taper);
      const tuft = new THREE.Group();
      tuft.position.set(tipX, tipY, 0);
      g.add(tuft);
      ball(tuft, MAT.leafDark, 0, lb.tuft * 0.2, 0, lb.tuft, lb.tuft * 0.9, lb.tuft, GEO.ico).rotation.set(0.4, 1.1, 0);
      ball(tuft, MAT.leaf, -lb.tuft * 0.35, lb.tuft * 0.55, lb.tuft * 0.25, lb.tuft * 0.8, lb.tuft * 0.75, lb.tuft * 0.8, GEO.ico).rotation.set(1.2, 0.3, 0);
      ball(tuft, MAT.leaf, lb.tuft * 0.45, lb.tuft * 0.45, -lb.tuft * 0.1, lb.tuft * 0.6, lb.tuft * 0.6, lb.tuft * 0.6, GEO.ico).rotation.set(0.2, 2.1, 0.5);
      ball(g, MAT.leafDark, midX - lb.len * 0.07, midY + lb.tuft * 1.0, 0, lb.tuft * 0.75, lb.tuft * 0.7, lb.tuft * 0.75, GEO.ico).rotation.set(0.8, 0.6, 0);
      R3.limbs.push({ g, tuft, phase: lb.phase, lift: lb.lift, len: lb.len });
    }
    // Canopy: the leaf clusters become faceted balls at a few depths, with a darker row behind.
    for (const cl of BG.clusters) {
      const z0 = (hash(cl.x + cl.y) - 0.6) * cl.r * 0.8;
      const m = ball(T, cl.dark ? MAT.leafDark : MAT.leaf, X(cl.x), Y(cl.y), z0, cl.r, cl.r * 0.92, cl.r, GEO.ico);
      m.rotation.set(hash(cl.x) * 3, hash(cl.y) * 3, 0);
      m.receiveShadow = true;
      R3.clusters.push({ m, x0: X(cl.x), y0: Y(cl.y), z0, r: cl.r, phase: cl.phase, rot0: m.rotation.y });
      if (cl.dark) {
        const b = ball(T, MAT.leafDeep, X(cl.x) + cl.r * 0.4, Y(cl.y) + cl.r * 0.1, z0 - cl.r * 1.3, cl.r * 1.15, cl.r, cl.r, GEO.ico);
        b.rotation.set(1, hash(cl.x + 3) * 3, 0);
        b.castShadow = false;
      }
    }
    // Acorns hanging under the leaves, each on a short stem.
    for (const hg of BG.hang) {
      const g = new THREE.Group();
      g.position.set(X(hg.x), Y(hg.y - L.acornR * 1.2), 10);
      T.add(g);
      rod(g, MAT.cap, 0, 0, 0, 0, -L.acornR * 0.9, 0, 1.2);
      const a = makeAcorn(L.acornR * 0.55, 'plain');
      a.position.y = -L.acornR * 1.2;
      a.traverse(o => { if (o.isMesh) o.castShadow = true; });
      g.add(a);
      R3.hang.push({ g, y0: g.position.y, phase: hg.phase });
    }
    // A pool of drifting leaves.
    for (let i = 0; i < 6; i++) {
      const m = ball(T, MAT.leaf, 0, 0, 25, 1, 1, 1, GEO.low);
      m.visible = false;
      m.castShadow = false;
      R3.leaves.push(m);
    }
    // The cheering crowd, hidden until the dance.
    for (let i = 0; i < 4; i++) {
      const hd = makePeekHead(L.S * 0.17, i % 2 === 1);
      hd.visible = false;
      T.add(hd);
      R3.peekers.push(hd);
    }
    // Clouds, far back and scaled up to match.
    const CG = R3.cloudG;
    CG.clear();
    R3.clouds = [];
    for (const c of BG.clouds) {
      const g = new THREE.Group();
      CG.add(g);
      for (const [ox, oy, rr] of [[0, 0, 0.55], [0.55, 0.18, 0.65], [1.2, 0, 0.5], [0.6, -0.2, 0.55]]) {
        const m = ball(g, MAT.cloud, ox * c.s, oy * c.s, (ox - 0.6) * c.s * 0.3, rr * c.s);
        m.castShadow = false;
      }
      R3.clouds.push({ g, c });
    }
  }

  // Sway, drift, bob: the background breathes once per frame.
  function animateScene() {
    const windy = state.mode === 'playing' ? (speedMul() - 1) / (TUNE.maxMul - 1) : 0;
    const sway = 1 + windy * 2.5;
    for (const lb of R3.limbs) {
      const bend = Math.sin(bgT * 1.1 + lb.phase) * sway * lb.lift * 0.12;
      lb.g.rotation.z = bend * 1.6 / lb.len;
      lb.tuft.rotation.z = Math.sin(bgT * 1.5 + lb.phase) * sway * 0.06;
    }
    for (const cl of R3.clusters) {
      const dx = Math.sin(bgT * 1.3 + cl.phase) * sway * cl.r * 0.045;
      const dy = Math.cos(bgT * 0.9 + cl.phase) * sway * cl.r * 0.02;
      cl.m.position.set(cl.x0 + dx, cl.y0 + dy, cl.z0);
      cl.m.rotation.y = cl.rot0 + Math.sin(bgT * 0.7 + cl.phase) * 0.06 * sway;
    }
    for (const hg of R3.hang) {
      const bob = Math.sin(bgT * 2 + hg.phase) * (2 + windy * 4);
      hg.g.position.y = hg.y0 - bob;
      hg.g.rotation.z = Math.sin(bgT * 1.3 + hg.phase) * sway * 0.08;
    }
    for (let i = 0; i < R3.leaves.length; i++) {
      const m = R3.leaves[i], lf = BG.leaves[i];
      m.visible = !!lf;
      if (!lf) continue;
      m.position.set(X(lf.x), Y(lf.y), 25);
      m.rotation.set(lf.rot * 0.5, lf.rot, Math.sin(lf.phase) * 0.6);
      m.scale.set(lf.size, lf.size * 0.5, lf.size * 0.15);
    }
    for (const cd of R3.clouds) cd.g.position.set(X(cd.c.x), Y(cd.c.y), 0);
    // The crowd pokes out from behind the leaves during the dance.
    const edgeY = L.canopyY + BG.r * 0.62, pr = L.S * 0.17, spots = [0.12, 0.33, 0.56, 0.78];
    for (let i = 0; i < R3.peekers.length; i++) {
      const hd = R3.peekers[i];
      if (state.dance <= 0) { hd.visible = false; continue; }
      const p = 1.1 - state.dance;
      const phase = Math.max(0, Math.min(1, (p - i * 0.08) / 0.8));
      hd.visible = phase > 0;
      if (!hd.visible) continue;
      const poke = Math.sin(phase * Math.PI) * pr * 2.1;
      hd.position.set(X(spots[i] * (L.trunkX - pr * 2) + pr), Y(edgeY - pr * 1.4 + poke), -BG.r * 0.45);
      hd.rotation.z = Math.sin(bgT * 14 + i) * 0.12;
    }
  }

  // ------------------------------------------------------------------
  // Things that are made of acorns: falling acorns, the litter, the piles.
  // ------------------------------------------------------------------
  function makeAcorn(r, kind) {
    const g = new THREE.Group();
    const bodyM = kind === 'gold' ? MAT.gold : kind === 'rotten' ? MAT.rotten : kind === 'sweep' ? MAT.silver : kind === 'ten' ? MAT.ruby : MAT.acorn;
    const capM = kind === 'gold' ? MAT.goldCap : kind === 'rotten' ? MAT.rottenCap : kind === 'sweep' ? MAT.silverCap : kind === 'ten' ? MAT.rubyCap : MAT.cap;
    ball(g, bodyM, 0, 0, 0, r, r, r, GEO.acornBody);
    ball(g, bodyM, 0, 0, 0, r, r, r, GEO.acornTip);          // the little point at the bottom
    ball(g, capM, 0, 0, 0, r, r, r, GEO.acornCap);
    ball(g, capM, 0, 0, 0, r, r, r, GEO.acornRim);           // a raised rim where the cap meets the shell
    rod(g, capM, 0, r * 0.95, 0, 0, r * 1.32, 0, r * 0.1);
    ball(g, capM, 0, r * 1.34, 0, r * 0.15, r * 0.1, r * 0.15);   // knob on the stem
    if (kind === 'rotten') {
      ball(g, MAT.mould, -r * 0.3, -r * 0.3, r * 0.85, r * 0.2);
      ball(g, MAT.mould, r * 0.35, -r * 0.05, r * 0.9, r * 0.14);
      ball(g, MAT.mould, r * 0.05, -r * 0.6, r * 0.75, r * 0.11);
    }
    // Falling things cast no shadow: only dangers warn you from the ground.
    g.traverse(o => { if (o.isMesh) o.castShadow = false; });
    return g;
  }

  function makeAcornMesh(a) {
    const kind = a.gold ? 'gold' : a.rotten ? 'rotten' : a.sweep ? 'sweep' : a.ten ? 'ten' : 'plain';
    const r = L.acornR * ((a.gold || a.sweep || a.ten) ? 1.15 : a.rotten ? 1.0 : 0.95);
    const g = makeAcorn(r, kind);
    const m = { g, blob: null, halo: null, star: null, stink: null, ring: null, tag: null, r };
    if (a.gold || a.sweep || a.ten) {
      m.halo = new THREE.Sprite(a.gold ? MAT.halo : a.sweep ? MAT.haloBlue : MAT.haloRed);
      m.halo.scale.set(r * 5.2, r * 5.2, 1);
      g.add(m.halo);
      m.star = new THREE.Sprite(MAT.star);
      m.star.position.set(r * 1.3, r * 1.2, r);
      g.add(m.star);
    }
    if (a.sweep) {
      // A spinning ring: the sweeper reads as a power-up from a distance.
      m.ring = new THREE.Mesh(GEO.acornRim, MAT.ring);
      m.ring.scale.set(r * 2.1, r * 2.1, r * 2.1);
      m.ring.position.y = -r * 0.5 * 2.1 + r * 0.1;
      m.ring.castShadow = false;
      g.add(m.ring);
    }
    if (a.ten) {
      m.tag = new THREE.Sprite(MAT.tenTag);
      m.tag.scale.set(r * 3.2, r * 3.2, 1);
      g.add(m.tag);
    }
    if (a.rotten) {
      // Rotten acorns cast a faint shadow: the sneaky middle case between acorns and branches.
      m.blob = new THREE.Mesh(GEO.disc, MAT.blobFaint);
      m.blob.rotation.x = -Math.PI / 2;
      m.blob.scale.set(L.acornR * 1.4, L.acornR * 1.3, 1);
      m.blob.renderOrder = 1;
      m.stink = [ball(g, MAT.stink, -r * 0.55, r * 1.3, r * 0.3, r * 0.16), ball(g, MAT.stink, r * 0.55, r * 1.3, r * 0.3, r * 0.13)];
      for (const s of m.stink) s.castShadow = false;
    }
    return m;
  }

  function syncAcorns() {
    const seen = R3.seen;
    seen.clear();
    for (const a of state.acorns) {
      let m = R3.acorns.get(a);
      if (!m) {
        m = makeAcornMesh(a);
        R3.acorns.set(a, m);
        R3.playG.add(m.g);
        if (m.blob) R3.playG.add(m.blob);
      }
      seen.add(a);
      m.g.position.set(X(a.x), Y(a.y), 0);
      if (a.gold || a.sweep || a.ten) {
        m.g.rotation.set(0, a.rot * 0.8, Math.sin(a.wob) * 0.25);
        const pulse = 0.75 + 0.25 * Math.sin(state.t * 7);
        m.halo.material.opacity = 0.55 * pulse;
        const tw = 0.6 + 0.4 * Math.sin(state.t * 11 + 1);
        m.star.scale.set(m.r * 1.3 * tw, m.r * 1.3 * tw, 1);
        if (m.ring) { m.ring.rotation.set(0.5 + Math.sin(bgT * 2) * 0.4, bgT * 4, 0); }
        if (m.tag) {
          m.tag.position.set(0, m.r * 2.4 + Math.sin(bgT * 5) * m.r * 0.25, m.r);
          const ts = m.r * (3.0 + 0.3 * Math.sin(bgT * 6));
          m.tag.scale.set(ts, ts, 1);
        }
      } else {
        m.g.rotation.set(a.rot * 0.4, a.rot * 0.9, a.rot * 0.3);
      }
      if (m.blob) {
        m.blob.visible = !a.bounced;
        m.blob.position.set(X(a.x), state.rise + 1.2, 0);
      }
      if (m.stink) {
        for (let i = 0; i < 2; i++) {
          const ph = (bgT * 0.8 + i * 0.5) % 1;
          m.stink[i].position.set((i ? 1 : -1) * m.r * 0.55 + Math.sin(bgT * 4 + i) * m.r * 0.3, m.r * (1.1 + ph * 0.9), m.r * 0.3);
          m.stink[i].material.opacity = 0.45 * (1 - ph);
        }
      }
    }
    for (const [a, m] of R3.acorns) {
      if (seen.has(a)) continue;
      R3.playG.remove(m.g);
      if (m.blob) R3.playG.remove(m.blob);
      R3.acorns.delete(a);
    }
  }

  function makeBranch() {
    const g = new THREE.Group();
    const w = L.branchW, h = L.branchH;
    rod(g, MAT.branch, -w / 2, 0, 0, w / 2, 0, 0, h * 0.45);
    rod(g, MAT.branch, -w * 0.15, 0, 0, -w * 0.05, h * 0.9, h * 0.3, h * 0.2);
    rod(g, MAT.branch, w * 0.2, 0, 0, w * 0.32, h * 0.75, -h * 0.4, h * 0.16);
    ball(g, MAT.leafDark, w * 0.46, h * 0.55, 0, h * 0.6, h * 0.5, h * 0.6, GEO.ico);
    ball(g, MAT.leaf, w * 0.55, h * 0.35, h * 0.3, h * 0.5, h * 0.4, h * 0.5, GEO.ico);
    ball(g, MAT.leaf, w * 0.38, h * 0.9, -h * 0.2, h * 0.42, h * 0.35, h * 0.42, GEO.ico);
    g.traverse(o => { if (o.isMesh) o.castShadow = false; });
    return g;
  }

  function syncBranches() {
    const seen = R3.seen;
    seen.clear();
    for (const b of state.branches) {
      let m = R3.branches.get(b);
      if (!m) {
        const blob = new THREE.Mesh(GEO.disc, new THREE.MeshBasicMaterial({ color: '#000000', transparent: true, opacity: 0.3, depthWrite: false }));
        blob.rotation.x = -Math.PI / 2;
        blob.renderOrder = 1;
        m = { g: makeBranch(), blob, phase: Math.random() * 6.28, tumble: 2 + Math.random() * 2 };
        R3.branches.set(b, m);
        R3.playG.add(m.g, m.blob);
      }
      seen.add(b);
      m.g.position.set(X(b.x), Y(b.y), 0);
      m.g.rotation.set(bgT * m.tumble + m.phase, 0, Math.sin(bgT * 2 + m.phase) * 0.12);
      // The shadow grows and darkens as the branch closes in.
      const p = Math.max(0, Math.min(1, (b.y - b.startY) / (L.groundY - b.startY)));
      const w = L.branchW * (0.45 + 0.65 * p);
      m.blob.scale.set(w / 2, w * 0.42, 1);
      m.blob.position.set(X(b.x), state.rise + 1.5, 0);
      m.blob.material.opacity = 0.18 + 0.4 * p;
    }
    for (const [b, m] of R3.branches) {
      if (seen.has(b)) continue;
      R3.playG.remove(m.g, m.blob);
      m.blob.material.dispose();
      R3.branches.delete(b);
    }
  }

  const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _e = new THREE.Euler();
  const COL = { acorn: new THREE.Color('#8a5a2b'), cap: new THREE.Color('#5e3b19'), gold: new THREE.Color('#e9b63a'), goldCap: new THREE.Color('#a66d10') };

  // Missed acorns lie where they fell, on top of the slab they have built.
  function syncLitter() {
    const li = R3.litter, n = state.litter.length;
    const key = n + ':' + Math.round(state.rise) + ':' + W + ':' + L.acornR.toFixed(1);
    if (key === li.lastKey) return;
    li.lastKey = key;
    R3.slab.visible = state.rise > 0.5;
    R3.slab.scale.set(W * 3, Math.max(0.1, state.rise), 290);
    const m = Math.min(li.capacity, n), off = Math.max(0, n - li.capacity), ar = L.acornR * 0.85;
    for (let k = 0; k < m; k++) {
      const lt = state.litter[k + off], j = k + off;
      _p.set(lt.fx * W - W / 2, state.rise + ar * 0.9, hash(j + 500) * 250 - 200);
      _e.set(Math.PI / 2 + (hash(j + 900) - 0.5) * 0.7, lt.rot * 3, 0);
      _q.setFromEuler(_e);
      _s.setScalar(ar);
      _m4.compose(_p, _q, _s);
      li.body.setMatrixAt(k, _m4);
      li.cap.setMatrixAt(k, _m4);
      li.body.setColorAt(k, lt.gold ? COL.gold : COL.acorn);
      li.cap.setColorAt(k, lt.gold ? COL.goldCap : COL.cap);
    }
    li.body.count = li.cap.count = m;
    li.body.instanceMatrix.needsUpdate = li.cap.instanceMatrix.needsUpdate = true;
    if (li.body.instanceColor) li.body.instanceColor.needsUpdate = true;
    if (li.cap.instanceColor) li.cap.instanceColor.needsUpdate = true;
  }

  function syncFx() {
    const fx = R3.fx;
    let k = 0;
    const ar = L.acornR * 0.85;
    for (const f of state.fx) {
      if (f.t < 0 || k >= fx.capacity) continue;
      const p = Math.min(1, f.t / f.life);
      let x, y, z = 10, sc = ar;
      if (f.kind === 'poof') {
        x = f.x; y = f.y;
        sc = ar * (1 - p * p);                               // shrinks away as it floats off
      } else {
        x = f.x + (f.tx - f.x) * p;
        y = f.y + (f.ty - f.y) * p - Math.sin(p * Math.PI) * f.arc;
        z = 40 - p * 90;                                      // lands behind, where the pile sits
      }
      _p.set(X(x), Y(y), z);
      _e.set(f.rot * 0.5, f.rot, f.rot * 0.3);
      _q.setFromEuler(_e);
      _s.setScalar(Math.max(0.001, sc));
      _m4.compose(_p, _q, _s);
      fx.body.setMatrixAt(k, _m4);
      fx.cap.setMatrixAt(k, _m4);
      fx.body.setColorAt(k, f.gold ? COL.gold : COL.acorn);
      fx.cap.setColorAt(k, f.gold ? COL.goldCap : COL.cap);
      k++;
    }
    fx.body.count = fx.cap.count = k;
    if (k) {
      fx.body.instanceMatrix.needsUpdate = fx.cap.instanceMatrix.needsUpdate = true;
      if (fx.body.instanceColor) fx.body.instanceColor.needsUpdate = true;
      if (fx.cap.instanceColor) fx.cap.instanceColor.needsUpdate = true;
    }
  }

  // A pile is a mound with real acorns heaped over it. The ghost is the same mound, see-through.
  function makePile() {
    const g = new THREE.Group();
    const dome = new THREE.Mesh(GEO.dome, MAT.heap);
    dome.castShadow = true;
    dome.receiveShadow = true;
    const wire = new THREE.Mesh(GEO.dome, MAT.ghostWire);
    wire.visible = false;
    const CAP = 170;
    const body = new THREE.InstancedMesh(GEO.acornBody, MAT.acorn, CAP);
    const cap = new THREE.InstancedMesh(GEO.acornCap, MAT.cap, CAP);
    for (const m of [body, cap]) { m.castShadow = true; m.receiveShadow = true; m.count = 0; m.frustumCulled = false; }
    g.add(dome, wire, body, cap);
    g.visible = false;
    return { g, dome, wire, body, cap, capacity: CAP, lastKey: '' };
  }

  function syncPile(p, cx, n, asGhost) {
    const r = pileRadius(n);
    p.g.visible = r > 0;
    if (!p.g.visible) return;
    const key = n + ':' + Math.round(r) + ':' + asGhost + ':' + Math.round(state.rise) + ':' + L.acornR.toFixed(1) + ':' + Math.round(cx);
    if (key === p.lastKey) return;
    p.lastKey = key;
    p.g.position.set(X(cx), state.rise, 0);
    p.dome.scale.set(r * 1.25, r * 1.15, r * 0.95);
    p.wire.scale.copy(p.dome.scale);
    p.dome.material = asGhost ? MAT.ghost : MAT.heap;
    p.dome.castShadow = !asGhost;
    p.wire.visible = asGhost;
    const m = asGhost ? 0 : Math.min(p.capacity, n);
    const ar = Math.min(L.acornR * 0.8, r * 0.42);
    for (let k = 0; k < m; k++) {
      // Spiral down the dome from the top so the heap fills evenly.
      const yk = 1 - (k + 0.5) / m * 0.92;
      const rr = Math.sqrt(Math.max(0, 1 - yk * yk)), th = k * 2.39996 + 0.5;
      _p.set(Math.cos(th) * rr * r * 1.22, yk * r * 1.12, Math.sin(th) * rr * r * 0.92);
      _e.set(hash(k) * 3, hash(k + 77) * 6, hash(k + 31) * 3);
      _q.setFromEuler(_e);
      _s.setScalar(ar);
      _m4.compose(_p, _q, _s);
      p.body.setMatrixAt(k, _m4);
      p.cap.setMatrixAt(k, _m4);
    }
    p.body.count = p.cap.count = m;
    p.body.instanceMatrix.needsUpdate = p.cap.instanceMatrix.needsUpdate = true;
  }

  // ------------------------------------------------------------------
  // The squirrel. Built in a local space where (0,0,0) is the point where
  // its feet touch the ground, facing +x, S = overall size. The near side
  // of the body is +z, toward the camera.
  // ------------------------------------------------------------------
  function buildSquirrel(S) {
    const fur = MAT.fur.clone(), cheek = MAT.cheek.clone();
    const g = new THREE.Group();
    const sq = {
      g, S, fur, cheek,
      furColor: new THREE.Color(FUR), sickColor: new THREE.Color('#b9a04a'),
      cheekColor: new THREE.Color('#f1c08f'), sickCheek: new THREE.Color('#a9c37a')
    };
    // Tail: a thick S-curve tube behind the body with a lighter stripe and a bushy tip.
    const pivot = new THREE.Vector3(-0.08 * S, 0.22 * S, 0);
    const pts = [[-0.08, 0.22, 0], [-0.36, 0.17, -0.03], [-0.54, 0.52, -0.06], [-0.44, 0.9, -0.03], [-0.14, 1.0, 0.02]]
      .map(p => new THREE.Vector3(p[0] * S, p[1] * S, p[2] * S).sub(pivot));
    const curve = new THREE.CatmullRomCurve3(pts);
    const tail = new THREE.Group();
    tail.position.copy(pivot);
    g.add(tail);
    const t1 = new THREE.Mesh(new THREE.TubeGeometry(curve, 28, 0.095 * S, 10, false), MAT.furDark);
    t1.castShadow = true;
    tail.add(t1);
    const t2 = new THREE.Mesh(new THREE.TubeGeometry(curve, 28, 0.062 * S, 8, false), fur);
    t2.position.z = 0.05 * S;
    tail.add(t2);
    const tip = pts[pts.length - 1];
    ball(tail, MAT.furDark, tip.x, tip.y, tip.z, 0.115 * S);
    ball(tail, MAT.furLight, tip.x + 0.02 * S, tip.y, tip.z + 0.07 * S, 0.07 * S);
    sq.tail = tail;
    // Body and belly.
    sq.body = ball(g, fur, 0, 0.30 * S, 0, 0.23 * S, 0.27 * S, 0.20 * S);
    sq.belly = ball(g, MAT.belly, 0.08 * S, 0.27 * S, 0.06 * S, 0.16 * S, 0.19 * S, 0.16 * S);
    // Haunches, feet, arms and paws: the near side at +z, the far side at -z.
    sq.feet = []; sq.arms = []; sq.paws = [];
    for (const side of [1, -1]) {
      ball(g, fur, -0.04 * S, 0.14 * S, side * 0.11 * S, 0.10 * S, 0.09 * S, 0.08 * S);
      sq.feet.push(ball(g, side > 0 ? fur : MAT.furDark, 0, 0.035 * S, side * 0.10 * S, 0.11 * S, 0.04 * S, 0.06 * S));
      sq.arms.push(rod(g, fur, 0.11 * S, 0.40 * S, side * 0.09 * S, 0.26 * S, 0.50 * S, side * 0.05 * S, 0.03 * S));
      sq.paws.push(ball(g, MAT.furDark, 0.27 * S, 0.51 * S, side * 0.05 * S, 0.032 * S));
    }
    sq.held = makeAcorn(0.06 * S, 'plain');
    sq.held.position.set(0.31 * S, 0.46 * S, 0);
    sq.held.visible = false;
    g.add(sq.held);
    // Head.
    const head = new THREE.Group();
    head.position.set(0.15 * S, 0.60 * S, 0);
    g.add(head);
    sq.head = head;
    ball(head, fur, 0, 0, 0, 0.17 * S);
    for (const side of [1, -1]) {
      ball(head, fur, -0.08 * S, 0.15 * S, side * 0.085 * S, 0.06 * S, 0.07 * S, 0.045 * S);
      ball(head, MAT.pink, -0.065 * S, 0.15 * S, side * 0.085 * S, 0.035 * S, 0.045 * S, 0.025 * S);
    }
    ball(head, MAT.belly, 0.12 * S, -0.04 * S, 0, 0.085 * S, 0.075 * S, 0.085 * S);   // snout
    ball(head, MAT.ink, 0.195 * S, -0.02 * S, 0, 0.03 * S);                           // nose
    sq.mouth = ball(head, MAT.ink, 0.16 * S, -0.08 * S, 0, 0.03 * S, 0.007 * S, 0.025 * S);
    sq.eyes = []; sq.pupils = []; sq.cheeks = [];
    for (const side of [1, -1]) {
      sq.eyes.push(ball(head, MAT.white, 0.06 * S, 0.045 * S, side * 0.115 * S, 0.05 * S));
      const p = new THREE.Group();
      p.position.set(0.06 * S, 0.045 * S, side * 0.115 * S);
      head.add(p);
      ball(p, MAT.ink, 0.028 * S, 0, side * 0.025 * S, 0.028 * S);
      ball(p, MAT.white, 0.045 * S, 0.012 * S, side * 0.03 * S, 0.01 * S);
      sq.pupils.push(p);
      // Cheeks carry the lives: bigger with more acorns tucked in.
      sq.cheeks.push(ball(head, cheek, 0.07 * S, -0.09 * S, side * 0.13 * S, 0.06 * S));
    }
    sq.sweat = [ball(head, MAT.sweat, -0.12 * S, 0.1 * S, 0.12 * S, 0.025 * S), ball(head, MAT.sweat, -0.02 * S, 0.2 * S, 0.1 * S, 0.02 * S)];
    for (const s of sq.sweat) { s.visible = false; s.castShadow = false; }
    return sq;
  }

  function setArms(sq, sitting, run) {
    const S = sq.S;
    for (let i = 0; i < 2; i++) {
      const side = i === 0 ? 1 : -1;
      if (sitting) {
        setRod(sq.arms[i], 0.11 * S, 0.36 * S, side * 0.09 * S, 0.28 * S, 0.44 * S, side * 0.03 * S, 0.03 * S);
        sq.paws[i].position.set(0.29 * S, 0.45 * S, side * 0.03 * S);
      } else {
        const sw = Math.sin(run + i * Math.PI) * 0.03;
        setRod(sq.arms[i], 0.11 * S, 0.40 * S, side * 0.09 * S, (0.26 + sw) * S, (0.50 - sw) * S, side * 0.05 * S, 0.03 * S);
        sq.paws[i].position.set((0.27 + sw) * S, (0.51 - sw) * S, side * 0.05 * S);
      }
    }
  }

  function updateSquirrel3D() {
    const sq = R3.sq, S = L.SQ, g = sq.g;
    const sitting = state.mode === 'gameover';
    let gy = state.rise;   // feet on the surface
    if (sitting) {
      // Perch on top of the pile once we've walked there.
      const k = Math.min(1, state.over.t / 1.1);
      gy += pileRadius(state.pile) * 1.05 * k;
    }
    // Blink while invulnerable.
    g.visible = !(state.invuln > 0 && Math.floor(state.invuln * 14) % 2 === 0);
    // Turning: ease between the two three-quarter views, passing through a face-on frame.
    R3.faceK += (state.facing - R3.faceK) * Math.min(1, frameDt * 9);
    const yaw = Math.PI / 2 - R3.faceK * (Math.PI / 2 + 0.35);
    let hop = 0, wig = 0, spin = 0;
    if (state.dance > 0) {
      // Victory hop with a wiggle and a twirl; play goes on underneath.
      const p = 1.1 - state.dance;
      hop = Math.abs(Math.sin(p * Math.PI * 4)) * S * 0.22;
      wig = Math.sin(p * Math.PI * 8) * 0.18;
      spin = Math.sin(p * Math.PI * 2) * 0.8;
    }
    const sick = state.slow > 0 && !sitting;
    const knocked = state.knocked > 0;
    const run = state.runPhase * Math.PI * 2;
    // Knocked down: flat on the back, belly up, legs flailing in the air.
    g.position.set(X(state.sx), gy + hop + (knocked ? S * 0.22 : 0), 0);
    g.rotation.set(0, yaw + spin, (knocked ? Math.PI / 2 : 0) + wig + (sick ? Math.sin(bgT * 9) * 0.04 : 0));
    const swing = knocked ? Math.sin(state.knocked * 22) * 0.16 : Math.sin(run) * 0.07;
    const spread = sitting ? 0.17 : 0.09;
    sq.feet[0].position.x = (spread - swing) * S;
    sq.feet[1].position.x = (-spread + swing) * S;
    sq.body.position.y = (sitting ? 0.26 : 0.30) * S;
    sq.body.scale.y = (sitting ? 0.24 : 0.27) * S;
    sq.belly.position.y = (sitting ? 0.24 : 0.27) * S;
    sq.head.position.y = (sitting ? 0.56 : 0.60) * S;
    setArms(sq, sitting, run);
    sq.held.visible = sitting;
    const lives = sitting ? 0 : state.lives;
    for (const c of sq.cheeks) { c.visible = lives > 0; c.scale.setScalar((0.055 + lives * 0.02) * S); }
    const open = knocked || state.slow > 0 || (sitting && Math.floor(state.over.t * 6) % 2 === 0);
    sq.mouth.scale.set(0.03 * S, (open ? 0.03 : 0.007) * S, 0.025 * S);
    sq.mouth.position.y = (open ? -0.095 : -0.08) * S;
    // Eyes blink every few seconds; squeezed shut when sick.
    const blink = !knocked && ((bgT % 3.7) < 0.12);
    const ey = (blink || sick) ? 0.12 : 1;
    for (const e of sq.eyes) e.scale.set(0.05 * S, 0.05 * S * ey, 0.05 * S);
    for (const p of sq.pupils) p.visible = ey === 1;
    // Sick: a green tinge and a couple of sweat drops.
    sq.fur.color.lerpColors(sq.furColor, sq.sickColor, sick ? 0.45 : 0);
    sq.cheek.color.lerpColors(sq.cheekColor, sq.sickCheek, sick ? 0.6 : 0);
    const dripY = (bgT * 1.7) % 1;
    sq.sweat[0].visible = sq.sweat[1].visible = sick;
    sq.sweat[0].position.y = (0.10 - dripY * 0.12) * S;
    sq.sweat[1].position.y = (0.2 - ((dripY + 0.5) % 1) * 0.1) * S;
    // Tail flicks while idle and swishes while running.
    const wag = knocked ? 0 : Math.sin(bgT * 2.6) * 0.05 + Math.sin(run) * 0.06 + (sick ? Math.sin(bgT * 9) * 0.03 : 0);
    sq.tail.rotation.set(wag * 2.5, 0, wag * 1.2);
  }

  // Small squirrel heads bobbing out from under the canopy while the crowd cheers.
  function makePeekHead(r, flip) {
    const g = new THREE.Group();
    ball(g, MAT.fur, 0, 0, 0, r);
    for (const s of [1, -1]) {
      ball(g, MAT.fur, -r * 0.55, r * 0.85, s * r * 0.3, r * 0.36);
      ball(g, MAT.pink, -r * 0.45, r * 0.85, s * r * 0.32, r * 0.2);
    }
    ball(g, MAT.belly, r * 0.7, -r * 0.25, 0, r * 0.5);
    ball(g, MAT.ink, r * 1.08, -r * 0.12, 0, r * 0.17);
    ball(g, MAT.ink, r * 0.85, -r * 0.5, 0, r * 0.18, r * 0.14, r * 0.12);   // open, cheering mouth
    for (const s of [1, -1]) {
      ball(g, MAT.white, r * 0.3, r * 0.25, s * r * 0.75, r * 0.28);
      ball(g, MAT.ink, r * 0.45, r * 0.25, s * r * 0.85, r * 0.17);
    }
    g.rotation.y = flip ? Math.PI + 0.35 : -0.35;
    return g;
  }

  // Gold motes radiating from the squirrel after a golden acorn.
  function makeSparkle() {
    const g = new THREE.Group(), dots = [];
    for (let i = 0; i < 10; i++) {
      const d = ball(g, i % 2 ? MAT.sparkA : MAT.sparkB, 0, 0, 0, 1, 1, 1, GEO.low);
      d.castShadow = false;
      dots.push(d);
    }
    g.visible = false;
    return { g, dots };
  }
  function updateSparkle() {
    const sp = R3.sparkle;
    sp.g.visible = state.sparkle > 0;
    if (!sp.g.visible) return;
    const S = L.SQ, p = 1 - state.sparkle / 0.8;   // 0 -> 1 over the effect
    const cx = X(state.sx), cy = state.rise + S * 0.5;
    MAT.sparkA.opacity = MAT.sparkB.opacity = 1 - p;
    sp.dots.forEach((d, i) => {
      const ang = i / 10 * Math.PI * 2 + p * 0.8, dd = S * (0.35 + p * 0.9);
      d.position.set(cx + Math.cos(ang) * dd, cy + Math.sin(ang) * dd * 0.8 + p * S * 0.3, Math.sin(ang * 2) * S * 0.3 + S * 0.2);
      d.scale.setScalar(S * 0.05 * (1 - p * 0.6));
    });
  }

  // ------------------------------------------------------------------
  // Text overlay: numbers on the piles, GAME OVER, and the pause dim.
  // ------------------------------------------------------------------
  const _v = new THREE.Vector3();
  function projectLocal(obj, x, y, z) {
    obj.localToWorld(_v.set(x, y, z)).project(camera);
    return { x: (_v.x + 1) / 2 * W, y: (1 - _v.y) / 2 * H };
  }

  // The caught count sits on the pile itself; the ghost pile shows the friend's number in grey.
  function drawPileLabel(p, n, ghost) {
    if (n <= 0) return;
    const r = pileRadius(n);
    if (r <= 0) return;
    let size = Math.max(14, Math.min(r * 0.95, L.S * 0.42, 34));
    if (!ghost && state.labelPop > 0) size *= 1 + 0.45 * Math.sin(Math.PI * state.labelPop / 0.35);   // a bounce each time a tossed acorn lands
    // Project on the pile's own plane rather than its front face: a point pushed
    // toward the camera gets magnified sideways too, which shoved the number off
    // the right edge on wide screens. Clamp as well so it can never leave the view.
    const pt = projectLocal(p.g, 0, Math.max(r * 0.55, size * 0.6), 0);
    const pad = size * 0.9;
    const lx = Math.max(pad, Math.min(W - pad, pt.x - r * 0.2));   // a touch left: the heap hugs the trunk
    const ly = Math.max(size, Math.min(H - size, pt.y));
    octx.save();
    octx.font = `800 ${size}px "Segoe UI", system-ui, -apple-system, Roboto, sans-serif`;
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.lineJoin = 'round';
    octx.lineWidth = size * 0.22;
    octx.strokeStyle = ghost ? 'rgba(255,255,255,0.85)' : '#fff';
    octx.fillStyle = ghost ? '#8c8c8c' : '#5e3b19';
    octx.strokeText(String(n), lx, ly);
    octx.fillText(String(n), lx, ly);
    octx.restore();
  }

  // "Game Over" pops in above the squirrel once it has settled on its pile.
  function drawGameOver() {
    const k = Math.min(1, (state.over.t - 1.3) / 0.45);
    const scale = 0.6 + 0.4 * (1 - Math.pow(1 - k, 3)) + (k < 1 ? Math.sin(k * Math.PI) * 0.12 : 0);
    const size = Math.min(W * 0.13, 64);
    octx.save();
    octx.translate(W / 2, H * 0.36);
    octx.scale(scale, scale);
    octx.globalAlpha = Math.min(1, k * 1.5);
    octx.font = `800 ${size}px "Segoe UI", system-ui, -apple-system, Roboto, sans-serif`;
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.lineJoin = 'round';
    octx.lineWidth = size * 0.18;
    octx.strokeStyle = 'rgba(255,255,255,0.95)';
    octx.strokeText('GAME OVER', 0, 0);
    octx.fillStyle = INK;
    octx.fillText('GAME OVER', 0, 0);
    octx.restore();
  }

  function drawOverlay() {
    octx.clearRect(0, 0, W, H);
    const ghostGone = state.ghost > 0 && state.pile > state.ghost;
    if (state.ghost > 0 && !ghostGone) drawPileLabel(R3.ghostPile, state.ghost, true);
    drawPileLabel(R3.pile, state.pile, false);
    if (state.mode === 'gameover' && state.over.shown) {
      // Soft dim so the buttons read; the pile stays the hero.
      octx.fillStyle = 'rgba(255,255,255,0.12)';
      octx.fillRect(0, 0, W, H);
      drawGameOver();
    } else if (state.mode === 'paused') {
      // Stronger dim so a frozen scene reads as paused, not stuck.
      octx.fillStyle = 'rgba(255,255,255,0.4)';
      octx.fillRect(0, 0, W, H);
    }
  }

  function draw() {
    if (!renderer) return;
    animateScene();
    syncLitter();
    syncFx();
    // Once the real pile is bigger, it visually swallows the ghost.
    const ghostGone = state.ghost > 0 && state.pile > state.ghost;
    syncPile(R3.ghostPile, L.ghostX, state.ghost, !ghostGone);
    syncPile(R3.pile, L.pileX, state.pile, false);
    syncAcorns();
    syncBranches();
    updateSquirrel3D();
    updateSparkle();
    renderer.render(scene, camera);
    drawOverlay();
  }

  // ------------------------------------------------------------------
  // Loop
  // ------------------------------------------------------------------
  let last = performance.now();
  // The splash shows its loading animation until the scene has rendered a
  // couple of frames (shaders compiled, textures uploaded) and the logo has had
  // a moment on screen; then the loader gives way to the Start button.
  let booted = false, bootFrames = 0;
  const BOOT_MIN = 1500;
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05; // tab switches and hiccups don't teleport things
    frameDt = dt;
    update(dt);
    draw();
    updateHud();
    if (!booted && ++bootFrames >= 2 && now >= BOOT_MIN) {
      booted = true;
      splash.classList.add('loaded');
    }
    requestAnimationFrame(frame);
  }

  document.addEventListener('visibilitychange', () => {
    last = performance.now();
    if (document.hidden) pauseGame();   // switching apps mid-run should not cost a life
  });
  window.addEventListener('blur', () => pauseGame());

  // Boot
  cacheColors();
  initScene();
  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
